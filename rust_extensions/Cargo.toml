[package]
name = "hledac-rust-extensions"
version = "0.1.0"
edition = "2021"

[lib]
name = "hledac_rust_extensions"
crate-type = ["cdylib", "rlib"]

[dependencies]
aho-corasick = "1.1"
pyo3 = { version = "0.28", features = ["extension-module"] }
rayon = "1.10"
regex = "1"
url = "2"
xxhash-rust = { version = "0.8", features = ["xxh3", "const_xxh3", "xxh64"] }
once_cell = "1.19"
sha2 = "0.10"
ahash = "0.8"
# Sprint ContentHasher: BLAKE3 for body-hash dedup.
# Default (non-aarch64) is scalar fallback; aarch64 override below enables NEON SIMD
# intrinsics for ~3-5x throughput on Apple Silicon.
blake3 = "1"
# Sprint P1-5 QualityGate: BLAKE2b-128 for OSINT finding dedup fingerprints.
# Must match Python hashlib.blake2b(digest_size=16).hexdigest() bit-for-bit for
# backward compatibility with existing LMDB-persisted fingerprints. Tiny crate
# (~30KB compiled), zero deps, NEON-vectorized on aarch64.
blake2 = "0.10"
# Sprint F265B-III: Page compression for LMDB hot-edges cache.
# lz4_flex = pure-Rust lz4, no C deps, M1-safe.
# zstd = higher ratio (~3:1), stdlib zlib fallback in conditional_cache.py.
lz4_flex = "0.10"
zstd = "0.13"
# F273F: madvise syscalls — libc provides madvise/open/close on Darwin
libc = "0.2"

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
strip = "symbols"
panic = "abort"

# aarch64 (Apple Silicon incl. M1) — enable ARM NEON SIMD for BLAKE3.
# Other targets get the scalar fallback from the [dependencies] block above.
[target.'cfg(target_arch = "aarch64")'.dependencies]
blake3 = { version = "1", features = ["neon"] }

[build-dependencies]
pyo3-build-config = "0.28"

# Modern (cargo 1.74+) centralized lint policy. Surfaces dead code and
# unused items at build time. Set to "warn" (not "deny") so we don't break
# the build on new dead code — we want visibility, not CI breakages.
# Promote to "deny" once the codebase is warning-free.
[lints.rust]
unused = "warn"
dead_code = "warn"
unused_imports = "warn"
