[package]
name = "hledac-rust-extensions"
version = "0.1.0"
edition = "2021"

[lib]
name = "hledac_rust_extensions"
crate-type = ["cdylib", "rlib"]

[dependencies]
aho-corasick = "1.1"
pyo3 = { version = "0.27", features = ["extension-module", "abi3-py314"] }
rayon = "1.12"
regex = "1.11"
regex-automata = { version = "0.4.14", default-features = false, features = ["meta"] }
url = "2"
lol_html = "2.9"
xxhash-rust = { version = "0.8", features = ["xxh3", "const_xxh3", "xxh64"] }
sha2 = "0.10"
ahash = "0.8"
parking_lot = "0.12.5"
memchr = "2.7"
bytemuck = "1"
blake2 = "0.10"
blake3 = "0.1"
unicode-normalization = "0.1"
lz4_flex = "0.10"
zstd = "0.13"
libc = "0.2"
duckdb = { version = "1.105", default-features = false, features = ["bundled"] }
ipnetwork = "0.21.1"
serde_json = "1"
serde = { version = "1", features = ["derive"] }
bincode = "2.0"
memmap2 = "0.9"
dirs = "5"
crossbeam-channel = "0.5"

[target.'cfg(target_os = "macos")'.dependencies]
metal = "0.33"
objc = "0.2"
block = "0.1"

[features]
default = []

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
strip = "symbols"
panic = "abort"

[build-dependencies]
pyo3-build-config = "0.27"

[lints.rust]
unused = "warn"
dead_code = "warn"
unused_imports = "warn"
