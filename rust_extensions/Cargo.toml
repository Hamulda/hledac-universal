[package]
name = "hledac-rust-extensions"
version = "0.1.0"
edition = "2021"

[lib]
name = "hledac_rust_extensions"
crate-type = ["cdylib", "rlib"]

[dependencies]
aho-corasick = "1.1"
pyo3 = { version = "0.23", features = ["extension-module", "abi3-py39"] }
rayon = "1.12"
regex = "1.11"
regex-automata = { version = "=0.4.15", default-features = false, features = ["meta"] }
url = "2"
lol_html = "2.9"
xml = "1.3"
xxhash-rust = { version = "0.8", features = ["xxh3", "const_xxh3", "xxh64"] }
sha2 = "0.10"
ahash = "0.8"
parking_lot = "0.12.5"
memchr = "2.7"
memmap2 = "0.9"
blake2 = "0.10"
blake3 = "0.1"
unicode-normalization = "0.1"
lz4_flex = "0.10"
libc = "0.2"
serde_json = "1"
crossbeam-channel = "0.5"
dashmap = "6"
duckdb = "1"
ipnetwork = "0.20"
# ISSUE-014: Missing crates that were used but not declared
bincode = { version = "2.0", features = ["derive", "serde"] }
zstd = "0.13"
dirs = "5"

[target.'cfg(target_os = "macos")'.dependencies]
metal = "0.33"

[features]
default = []

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
strip = "symbols"
panic = "abort"

[build-dependencies]
pyo3-build-config = "0.23"

[lints.rust]
unused = "warn"
dead_code = "warn"
unused_imports = "warn"
