[package]
name = "hledac-rust-extensions"
version = "0.1.0"
edition = "2021"

[lib]
name = "hledac_rust_extensions"
crate-type = ["cdylib", "rlib"]

[dependencies]
aho-corasick = "1.1"
pyo3 = { version = "0.28", features = ["extension-module"] }
rayon = "1.10"
regex = "1"
url = "2"
xxhash-rust = { version = "0.8", features = ["xxh3", "const_xxh3", "xxh64"] }
once_cell = "1.19"
sha2 = "0.10"
ahash = "0.8"
# Sprint ContentHasher: BLAKE3 for body-hash dedup.
# Default (non-aarch64) is scalar fallback; aarch64 override below enables NEON SIMD
# intrinsics for ~3-5x throughput on Apple Silicon.
blake3 = "1"

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1

[target.armv7-unknown-linux-gnueabihf]
rustflags = ["-C", "target-cpu=generic+neon"]

# aarch64 (Apple Silicon incl. M1) — enable ARM NEON SIMD for BLAKE3.
# Other targets get the scalar fallback from the [dependencies] block above.
[target.'cfg(target_arch = "aarch64")'.dependencies]
blake3 = { version = "1", features = ["neon"] }

[build-dependencies]
pyo3-build-config = "0.28"

[build]
rustflags = ["-C", "target-feature=+neon"]
