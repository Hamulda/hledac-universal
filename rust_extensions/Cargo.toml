[package]
name = "hledac-rust-extensions"
version = "0.1.0"
edition = "2021"

[lib]
name = "hledac_rust_extensions"
crate-type = ["cdylib", "rlib"]

[dependencies]
aho-corasick = "1.1"
pyo3 = { version = "0.29", features = ["extension-module"] }
rayon = "1.10"
regex = "1"
# R4.3: SIMD IOC extraction via regex-automata meta engine (Teddy NEON on M1).
# meta feature = perf + syntax + nfa + dfa + hybrid (full Teddy/SIMD support).
# perf-literal enables Teddy algorithm (SIMD bulk text) automatically on aarch64.
regex-automata = { version = "0.4", default-features = false, features = ["meta"] }
lazy_static = "1.4"  # R4.2: Compile-time IoC regex patterns
url = "2"
lol_html = "=2.1.0"
xxhash-rust = { version = "0.8", features = ["xxh3", "const_xxh3", "xxh64"] }
sha2 = { version = "0.10", features = ["asm"] }
ahash = "0.8"
# Sprint ContentHasher: BLAKE3 for body-hash dedup.
# Default (non-aarch64) is scalar fallback; aarch64 override below enables NEON SIMD
# intrinsics for ~3-5x throughput on Apple Silicon.
blake3 = "1"
# Sprint P1-5 QualityGate: BLAKE2b-128 for OSINT finding dedup fingerprints.
# Must match Python hashlib.blake2b(digest_size=16).hexdigest() bit-for-bit for
# backward compatibility with existing LMDB-persisted fingerprints. Tiny crate
# (~30KB compiled), zero deps, NEON-vectorized on aarch64.
blake2 = "0.10"
# Sprint F265B-III: Unicode NFC/NFD normalization + diacritic stripping for text.
unicode-normalization = "0.1"
# Sprint F265B-III: Page compression for LMDB hot-edges cache.
# lz4_flex = pure-Rust lz4, no C deps, M1-safe.
# zstd = higher ratio (~3:1), stdlib zlib fallback in conditional_cache.py.
lz4_flex = "0.10"
zstd = "0.13"
# F273F: madvise syscalls — libc provides madvise/open/close on Darwin
libc = "0.2"
# P2-1: duckdb — DuckDB Rust bindings for parallel graph traversal.
# Read-only connections safe across rayon worker threads. default=dbapi+core.
#
# BUNDLED STATIC BUILD (M1 8GB): Use DuckDB's bundled SQLite amalgamation source.
# - Avoids external `libduckdb.dylib` dependency → no Homebrew version mismatch.
# - DuckDB source compiles into the .dylib → zero external runtime deps.
# - Increases .dylib size by ~25 MB but stays within M1 8GB RAM budget.
# - `default-features = false` drops dynamic extensions (parquet, json, etc.)
#   which are not needed for read-only DuckPGQ graph traversal.
duckdb = { version = "1.105", default-features = false, features = ["bundled"] }

# Sprint P2-3: IP address parsing, classification, and CIDR containment.
ipnetwork = "0.20"

# Sprint F266: serde JSON — Rust-powered JSON serialization for STIX export.
# Serialization is CPU-bound; serde_json is 2-4× faster than Python json.dumps
# on M1 (no GIL, SIMD-optimized). Used for STIX bundle export at sprint end.
serde_json = "1"

# Sprint F265B-III: Cache serialization for graph_traverse LRU cache.
# bincode: compact binary serialization (no schema, fast).
bincode = "2.0"

# Sprint F265B-III: mmap-backed persistence for graph_traverse cache.
# M1 8GB safe — cache survives restart, lazy load on first access.
memmap2 = "0.9"

# Sprint F265B-III: Cache directory resolution for graph_traverse LRU cache.
# Cross-platform app data dirs (cache/).
dirs = "5"

# 3A: Native RSS + available-memory probe. Cross-platform, no subprocess.
sysinfo = { version = "0.31", optional = true, default-features = false, features = ["apple-app-store"] }

# P0: Lock-free SPSC queue for MLX worker thread coordination.
# M1 8GB: bounded ring buffer (no unbounded grow).
# crossbeam-channel: ~2-5ns push/pop, no mutex, no selector lock.
# aarch64: uses ARM LSE atomic instructions (ldadd, cas) natively.
crossbeam-channel = "0.5"

# F266-ZC: Arrow IPC bytes for CanonicalFinding batch construction.
# Replaces 6× Python list-comprehension loops with single-pass Rust IPC serialization.
# Uses hand-rolled Arrow IPC RecordBatchStream encoding (no arrow crate dep).
# IPC format: magic (4) + padding + schema + batch + footer (Arrow IPC spec v4).
# pyarrow >= 1.0 compatible (same wire format).
# M1 8GB: rayon parallel for N≥64, Vec<u8> allocated once.

# R4.2: Metal GPU acceleration for pattern matching on M1.
# metal = Metal Performance Shaders for GPU compute on M1 GPU.
# objc = Objective-C runtime for Metal device enumeration and event handling.
# block = Objective-C blocks for Metal completion/async handlers.
[target.'cfg(target_os = "macos")'.dependencies]
metal = "0.29"
objc = "0.2"
block = "0.1"

[features]
default = []
sysinfo = ["dep:sysinfo"]

[profile.release]
opt-level = 2
lto = "thin"
codegen-units = 4
strip = "symbols"
panic = "abort"

# aarch64 (Apple Silicon incl. M1) — enable ARM NEON SIMD for BLAKE3.
# xxhash-rust uses portable-simd automatically on aarch64 targets —
# the compiler vectorizes via LLVM's NEON backend, no explicit feature needed.
[target.'cfg(target_arch = "aarch64")'.dependencies]
blake3 = { version = "1", features = ["neon"] }

[build-dependencies]
pyo3-build-config = "0.29"

# Modern (cargo 1.74+) centralized lint policy. Surfaces dead code and
# unused items at build time. Set to "warn" (not "deny") so we don't break
# the build on new dead code — we want visibility, not CI breakages.
# Promote to "deny" once the codebase is warning-free.
[lints.rust]
unused = "warn"
dead_code = "warn"
unused_imports = "warn"
