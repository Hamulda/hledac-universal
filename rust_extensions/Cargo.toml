[package]
name = "hledac-rust-extensions"
version = "0.1.0"
edition = "2021"

[lib]
name = "hledac_rust_extensions"
crate-type = ["cdylib", "rlib"]

[dependencies]
aho-corasick = "1.1"
# R6: PyO3 0.29 — Python::attach + py.detach API.
# ISSUE-014: NON-ABI3 NATIVE WHEEL for Python 3.14 on M1 (aarch64-apple-darwin).
#
# WHY non-abi3:
#   - abi3 limits PyO3 to the stable ABI subset (no tp_subclass, no tp_new,
#     no full memory-view C API, no native 3.14 optimizations).
#   - Project already requires >=3.14 and platform is darwin/arm64 only →
#     zero cross-compatibility benefit from abi3; pure performance loss.
#   - Non-abi3 links against libpython3.14 dynamically, producing a
#     cp314-specific .so that gets full Python C API access.
#
# TRADE-OFF: Wheel is cp314-darwin-arm64 (not abi3-py314-none-any).
#   This is fine — we never deploy on other Python versions or platforms.
#
# CI ban: with_gil / allow_threads removed from all code (only comments remain).
pyo3 = { version = "0.29", features = ["extension-module"] }
rayon = "1.10"
# GRAPH-01: petgraph for graph algorithms (PageRank, Louvain community detection)
# Provides: GraphMap, UnGraph, DiGraph, NodeIndex, algo::kosaraju_scc
petgraph = { version = "0.6", features = ["serde-1"] }
regex = "1.11"
regex-automata = { version = "0.4.16", default-features = false, features = ["meta"] }
url = "2"
lol_html = "2.9"
xml = "1.3"
xxhash-rust = { version = "0.8", features = ["xxh3", "const_xxh3", "xxh64"] }
sha2 = "0.10"
sha3 = "0.10"  # GRAPH-03: SHA3-256 for .onion v3 checksum validation
aes-gcm = "0.10"
pbkdf2 = { version = "0.12", features = ["simple"] }
rand = "0.8"
ahash = "0.8"
parking_lot = "0.12"
memchr = "2.7"
memmap2 = "0.9"
num_cpus = "1.17"
blake2 = "0.10"
blake3 = "0.1"
unicode-normalization = "0.1"
lz4_flex = "0.10"
libc = "0.2"
serde_json = "1"
serde = { version = "1", features = ["derive"] }
crossbeam-channel = "0.5"
# R4 FIX (B-10): Remove bundled — Rust links against the shared DuckDB library
# provided by the Python duckdb wheel (single authority). This eliminates the
# ~15MB duplication of DuckDB C++ source in the Rust extension's address space.
# Python duckdb wheel (>=1.5.4) remains single authority for DuckDB SQL operations.
ipnetwork = "0.20"
lru = "0.10"
duckdb = { version = "1.105", optional = true }

# R24: OpenTelemetry-compatible tracing via tracing-subscriber JSON stdout
# Python reads spans from stdout JSON — no opentelemetry dep conflicts
tracing = { version = "0.1", optional = true, features = ["std"] }
tracing-subscriber = { version = "0.3", default-features = false, features = ["fmt", "env-filter", "json"], optional = true }

# PDF extraction via lopdf — pure Rust PDF parser
# Feature-gated: ~3MB additional compile, M1 8GB safe
# Enables: pdf.extract_text(), pdf.extract_iocs(), pdf.extract_text_from_bytes()
# MAINTENANCE NOTE (2026-07): lopdf is in maintenance mode — no new features.
# Python fallback: PyMuPDF in content_miner.py (already wired as primary path).
# Rust lopdf kept for backward compatibility; consider pdfium-render for new work.
lopdf = { version = "0.34", optional = true }

# Office documents — docx-rs + calamine + zip (for office feature)
docx-rs = { version = "0.4", optional = true }
calamine = { version = "0.26", default-features = false, features = ["default"], optional = true }
zip = { version = "2", default-features = false, features = ["deflate"], optional = true }

# TLS 1.3 fingerprinting — JA4 + ECH detection
# Feature-gated: ~2MB additional compile, M1 8GB safe
# Enables: rust.tls.ja4_from_client_hello(), connect_and_ja4(), batch_ja4()
rustls = { version = "0.23", default-features = false, features = ["std", "tls12", "ring"], optional = true }
hex = "0.4"
# ISSUE [ULTIMATE]-005: msgspec removed — not available on crates.io
# Using serde::Serialize derive instead

# STIX 2.1 bundle encoding (for stix feature)
# Feature-gated: ~2MB additional compile, M1 8GB safe
# Enables: stix.encode(), stix.decode(), stix.validate()
# NOTE: jsonschema crate removed 2026-07-27 — validation uses custom serde_json logic

# Fulltext search — Tantivy BM25 index (mmap-backed, zero-copy, persistent)
# Feature-gated: ~5MB additional compile, M1 8GB safe
# Enables: fulltext.create_index(), fulltext.search()
# M1 8GB: ~5MB RAM for Tantivy index (mmap-backed, vs ~200MB for Python BM25Index with 50K docs)
# Python fallback: BM25Index in knowledge/rag_engine.py
# ISSUE-011: Replaces Python in-memory BM25Index with mmap-backed Tantivy index
tantivy = { version = "0.22", optional = true }

# DNS resolution — DoH/DoT/DoQ via hickory-resolver
# Feature-gated: ~5MB additional compile, M1 8GB safe
# Enables: rust.dns.resolve_async(), resolve_happy_eyeballs(), prefetch()
#
# IMPORTANT: Using hickory-resolver directly (not hickory-dns meta-crate).
# hickory-resolver does NOT depend on SQLite — only hickory-server has optional sqlite.
# This avoids any conflict with arti-client's rusqlite dependency.
# Rustls is used for TLS (rustls-platform-verifier on macOS).
hickory-resolver = { version = "0.26", optional = true, features = ["tokio", "rustls-platform-verifier"] }
# P1-UPGRADE: tokio 1.x → 1.40+ (2026-07-27)
# Backward compatible for standard runtime builder APIs in dns.rs and quic.rs.
# io-util added for HEIST-02 Arti bridge (AsyncReadExt/AsyncWriteExt).
tokio = { version = "1.40", optional = true, features = ["rt-multi-thread", "net", "time", "sync", "io-util"] }

# QUIC/HTTP3 via quinn + h3 (for http3 feature)
# Feature-gated: ~8MB additional compile, M1 8GB safe
# Enables: rust.quic.fetch() — true HTTP/3 over QUIC
# M1 8GB: bounded to 3 concurrent connections, immediate memory release on drop
quinn = { version = "0.11", default-features = false, features = ["runtime-tokio", "ring"], optional = true }
h3 = { version = "0.0.8", default-features = false, optional = true }
h3-quinn = { version = "0.0.10", optional = true }
# ISSUE-014: Missing crates that were used but not declared
bincode = { version = "2.0", features = ["derive", "serde"] }
zstd = "0.13"
# HEIST-05: simd-json for zero-alloc JSON Pointer extraction (ARM NEON native)
# Used by simdjson_extract.rs for CT log scanning, NDJSON parsing — 2-4x faster
# than serde_json on aarch64, zero-alloc via BorrowedValue.
simd-json = { version = "0.14", optional = true }
dirs = "5"

# HEIST-02: Embedded Tor via Arti (Rust Tor client, feature-gated).
# Eliminates external tor binary subprocess + SOCKS5 IPC overhead.
# M1 8GB: ~20-30 MB resident (consensus cache + circuits), ~15 MB compile.
# Python fallback: TorTransport (external tor binary + SOCKS5 proxy).
arti-client = { version = "0.22", optional = true, default-features = false, features = ["tokio", "native-tls"] }
tor-rtcompat = { version = "0.22", optional = true }

# SILICON-03: Apple Network.framework bindings — user-space TCP + hardware TLS 1.3.
# objc2 provides safe Objective-C runtime bindings; block2 enables block/closure
# callbacks required by Network.framework's async C API.
# M1 8GB: ~3 MB compile, zero runtime overhead beyond framework linking.
# Platform: aarch64-apple-darwin ONLY (compiled conditionally via nw_framework feature).
objc2 = { version = "0.6", optional = true, features = ["unstable-apple-new"] }
block2 = { version = "0.6", optional = true }

# objc2-foundation: Safe Rust wrappers for Foundation types (NSString, NSArray,
# NSDictionary, NSData, NSError). Complements objc2's `apple` feature with
# higher-level type-safe APIs for ObjC interop beyond raw *mut c_void pointers.
# M1 8GB: ~1 MB compile, zero runtime overhead (thin message-send wrappers).
objc2-foundation = { version = "0.2", optional = true }

# SILICON-06: coreml — CoreML model loading, compilation, and ANE inference.
# Replaces the empty `ane` feature stub with real CoreML bindings from Rust.
# ANE (Apple Neural Engine) uses dedicated memory — does not compete with main RAM.
# M1 8GB: ~3 MB compile, models loaded from disk on-demand, released after use.
# Python fallback: coremltools + ANE via brain/ane_engine.py.
coreml = { version = "0.2", optional = true }

# SILICON-01: Metal GPU compute — opportunistic hash cracking during I/O wait.
# macOS-only (Metal.framework). ~45s compile, ~3 MB dylib.
# GPU buffers bounded to 64 MB, released after each crack call.
# CPU fallback: NEON + Rayon (always available, no Metal dep needed).
# Feature-gated: metal = ["dep:metal"]
metal = { version = "0.29", optional = true }

# SILICON-04: objc2-metal — safe MTLDevice, MTLBuffer, MTLCommandQueue types.
# Type-safe wrappers over Metal.framework C API. Complements metal_shared_buf.rs
# (currently uses raw C FFI) with safe Rust types for zero-copy buffer sharing.
# M1 8GB: ~1 MB compile, zero runtime overhead (thin ObjC message wrappers).
objc2-metal = { version = "0.2", optional = true }

# SILICON-02: Whisper.cpp speech-to-text via whisper-rs, CoreML/ANE backend.
# whisper-rs binds whisper.cpp (C/C++); on Apple Silicon supports WHISPER_COREML=1
# which delegates encoder inference to ANE (dedicated memory, not main RAM).
# M1 8GB: ONLY tiny (25 MB) and base (75 MB) models safe. Bounded to 1 concurrent inf.
# ~45s compile (whisper.cpp C++). Python fallback: mlx-whisper (MLX-native).
whisper-rs = { version = "0.13", optional = true }


# ---------------------------------------------------------------------------
# Feature flags — TRUE conditional compilation (D3 fix)
# ---------------------------------------------------------------------------
# Modules gated by a feature are compiled ONLY when that feature is enabled.
# See lib.rs for #[cfg(feature)] guards on module declarations.
#
# Dev shortcut (fastest): --no-default-features --features ""  (core only, ~5× faster)
# Core + data build:      default (core + data, DuckDB wired)
# Full build:             --features "full"  (everything, ~3× compile time)
#
# Python fallbacks exist for ALL optional modules:
#   duckdb modules → Python duckdb via DuckDBShadowStore
#   graph_traverse → sequential Python traversal
#
# ISSUE-021: Feature flags for selective compilation (M1 8GB compile time optimization)

[features]
# Default = core + data (DuckDB wired) — standard Hledac build
# R6: dns and native_db are OPT-IN (not default) — they add compile time + deps
#   dns:     ~5 MB compile (hickory-dns + tokio), ~8 MB resident
#   native_db: ~50 KB compile (pure Rust), ~200 KB resident per session
# Enable explicitly: --features "dns,native_db" or set HLEDAC_ENABLE_DNS=1 / HLEDAC_ENABLE_NATIVE_DB=1
default = ["core", "data"]

# core: IOC extraction, URL ops, hashing, compression, HTML parsing
# Always compiled. No heavy deps. Available even with --no-default-features.
core = [
    "bloom",
]

# data: DuckDB integration — Arrow batch, async queries, graph traversal
# Python fallback: DuckDBShadowStore.async_ingest_findings_batch via Python duckdb
# Adds: duckdb crate (~20 MB compile, ~15 MB resident)
data = [
    "dep:duckdb",
    "arrow_batch_builder",
    "graph_traverse",
    "link_predictor",
]


# graph: Graph analytics (LSH index, hot edges, centrality, petgraph) — no heavy deps, pure Rust
graph = [
    "lsh_index",
    "hot_edges",
    "graph_centrality",
    "graph_analytics",  # GRAPH-01: petgraph-based PageRank + Louvain + SCC
]

# accelerate: Accelerate/vDSP FFI for NER cosine similarity — OPTIONAL on macOS 26.5+
# vDSP symbols (_vDSP_maxmg etc.) are not available in the Accelerate.framework on macOS 26.5+
# Build with this feature disabled if you encounter "symbol not found in flat namespace" errors.
# Python fallback: scipy or numpy for cosine similarity (brain/ner_engine.py)
accelerate = []

# advanced: Feed pipeline, federated learning, pattern matching
# Pure Rust, no heavy deps — always compiled in full builds
# Includes: regex_lz4, content_hasher, adaptive_scheduler, simd_similarity,
# feed_decision, pipeline_compose, feed_pipeline, federated_qtable,
# signal_batch, dedup_bloom, graph_cache
advanced = [
    "regex_lz4",
    "content_hasher",
    "adaptive_scheduler",
    "swarm_dag",
    "simd_similarity",
    "feed_decision",
    "pipeline_compose",
    "feed_pipeline",
    "federated_qtable",
    "signal_batch",
    "dedup_bloom",
    "graph_cache",
]

# full: All features (development/CI only, ~3× compile time vs core-only)
# [NEXUS]-018-03: Mach vm_remap zero-copy remapping — opt-in, macOS only.
# No external deps — pure raw Mach syscall via libc + inline asm.
# Requires: rust fork() for sandbox IPC bridge, anonymous mmap, pipe.
# Feature-gated: compile with --features mach
# Python path: security/mach_remap.py lazy-imports rust.mach_remap only when
#   HLEDAC_ENABLE_MACH_REMAP=1 AND file_size >= 100MB.
mach = []

full = ["core", "data", "graph", "advanced", "tls13", "pdf", "office", "quic", "ane", "coreml_ane", "stix", "metal", "metal_shared", "otel", "fulltext", "native_db", "simdjson", "nw_framework", "whisper"]

# simdjson: Zero-alloc JSON Pointer extraction via simd-json (ARM NEON native)
# Adds: simdjson_extract.json_pointer_extract() — 2-4x faster than serde_json on M1
# M1 8GB: ~2MB compile, zero runtime alloc for BorrowedValue traversal
simdjson = [
    "dep:simd-json",
]

# native_db: Lightweight wire-protocol database extraction (MongoDB, Redis, Elasticsearch)
# No external crate deps — pure Rust std + crossbeam-channel (already a dep).
# Adds: rust.native_db.MongoDumper, RedisDumper, ElasticsearchDumper
# M1 8GB: ~50 KB compile, ~200 KB resident per extraction session
# Feature-gated: compile with --features native_db
# Python fallback: exposed_service_hunter.py logs auth status only.
native_db = []

# dns: DoH/DoT/DoQ DNS resolution via hickory-resolver
# Adds: rust.dns.resolve_async(), resolve_happy_eyeballs(), prefetch()
# M1 8GB: bounded cache (1024 hosts) + 50 concurrent queries
# Feature-gated to avoid ~5MB compile overhead when not needed
#
# FIX [SWARM]-009: Using hickory-resolver instead of hickory-dns.
# hickory-resolver does NOT depend on SQLite — only hickory-server has optional sqlite.
# This avoids conflict with arti-client's rusqlite dependency.
dns = [
    "dep:hickory-resolver",
    "dep:tokio",
]

# Individual module features — the actual gating is via #[cfg(feature)] in lib.rs.
# Only stubs that are referenced by a composite feature need to stay here.
# Empty stubs (X = []) have NO effect on compilation.
bloom = []           # Referenced by core; #[cfg(feature = "bloom")] in lib.rs
regex_lz4 = []        # Referenced by advanced; #[cfg(feature = "advanced")] in lib.rs
content_hasher = []   # Referenced by advanced; #[cfg(feature = "advanced")] in lib.rs
adaptive_scheduler = []  # Referenced by advanced; #[cfg(feature = "advanced")] in lib.rs
swarm_dag = []          # SILICON-07: Work-stealing task DAG; #[cfg(feature = "advanced")]
simd_similarity = []  # Referenced by advanced; #[cfg(feature = "advanced")] in lib.rs
feed_decision = []    # Referenced by advanced; #[cfg(feature = "advanced")] in lib.rs
pipeline_compose = [] # Referenced by advanced; #[cfg(feature = "advanced")] in lib.rs
graph_traverse = []   # Referenced by data
arrow_batch_builder = []  # Referenced by data
link_predictor = []   # SWARM-003: Link prediction (Adamic-Adar, Jaccard, Preferential Attachment)
lsh_index = []        # Referenced by graph
hot_edges = []         # Deprecated: module is hot_edges_rs, guarded by graph feature
# NOTE: hot_edges_rs is the actual module name, hot_edges feature is legacy alias
graph_centrality = [] # Referenced by graph — rayon-based parallel centrality
graph_analytics = []  # Referenced by graph — petgraph-based PageRank + Louvain + SCC
duckdb = []           # Referenced by data
feed_pipeline = []    # Referenced by advanced
federated_qtable = [] # Referenced by advanced
signal_batch = []     # Referenced by advanced
dedup_bloom = []      # Referenced by advanced
graph_cache = []      # Referenced by advanced
ane = []              # Apple Neural Engine bindings (model registry, batch validation)
# SILICON-06: coreml_ane — CoreML model loading + ANE offload from Rust.
# Replaces the empty `ane` stub with real CoreML bindings.
# coreml crate: ~3 MB compile, models loaded from disk on-demand.
# ANE uses dedicated memory — does not compete with main RAM budget.
# Python fallback: coremltools + brain/ane_engine.py for CoreML inference.
coreml_ane = ["dep:coreml"]
# SILICON-01: Metal GPU hash cracking — opportunistic during I/O wait
# metal crate: ~45s compile, ~3 MB dylib, macOS-only (Metal.framework)
# M1 8GB: GPU buffers bounded to 64 MB, released after each crack call
# Python fallback: CPU NEON + Rayon hash cracking (always available)
metal = ["dep:metal", "dep:objc2-metal"]

# SILICON-04: Shared Metal buffer — zero-copy Rust↔Python↔MLX tensor sharing
# Uses the same `metal` crate as the `metal` feature above.
# Provides: SharedMetalBuffer PyClass with MTLBuffer (StorageModeShared),
#   zero-copy numpy views via PEP 3118 buffer protocol,
#   batch MLX array creation (1 copy vs N copies).
metal_shared = ["dep:metal", "dep:objc2-metal"]

# R24: OpenTelemetry-compatible tracing via tracing-subscriber JSON stdout
# Python reads spans from stdout JSON — no opentelemetry dep conflicts
otel = [
    "dep:tracing",
    "dep:tracing-subscriber",
]

# SILICON-02: whisper — Whisper.cpp speech-to-text via CoreML/ANE backend.
# whisper-rs binds whisper.cpp (C/C++); WHISPER_COREML=1 delegates encoder
# inference to ANE (dedicated memory, not main RAM).
# M1 8GB: ONLY tiny (25 MB) and base (75 MB) models safe. Bounded 1 concurrent inf.
# ~45s compile (whisper.cpp C++). Python fallback: mlx-whisper (MLX-native).
whisper = ["dep:whisper-rs"]

# py-version: Python version compiled-for (via pyo3-build-config intercept_version)
# Adds: __py_version__() — enables Python version mismatch detection at runtime
# Requires pyo3-build-config in build-dependencies (already declared)
py-version = []

# stix: STIX 2.1 bundle encoding + validation
# Adds: stix.encode(), stix.decode(), stix.validate()
# M1 8GB: ~2MB compile, uses custom serde_json validation (jsonschema removed)
# Python fallback: runtime/stix_exporter.py uses json.dumps when Rust unavailable
stix = []

# tls13: TLS 1.3 fingerprinting — JA4 + ECH detection via rustls
# Adds: rust.tls.ja4_from_client_hello(), connect_and_ja4(), batch_ja4()
# M1 8GB: ~2MB compile, ~50KB per connection
# Feature-gated to avoid compile overhead when not needed
tls13 = [
    "dep:rustls",
]

# quic: QUIC/HTTP3 via quinn + h3
# Adds: rust.quic.fetch() — true HTTP/3 over QUIC
# M1 8GB: ~8MB compile, bounded to 3 concurrent connections
# Fallback path when curl_cffi Alt-Svc H3 upgrade fails
# P1-FIX: quic needs rustls for TLS (was only in tls13 feature)
quic = [
    "dep:quinn",
    "dep:h3",
    "dep:h3-quinn",
    "dep:rustls",
]

# fulltext: Tantivy full-text search (mmap-backed BM25, zero-copy, persistent)
# Adds: fulltext.create_index(), fulltext.search()
# M1 8GB: ~5MB compile, ~5MB RAM per index (mmap-backed)
# Python fallback: BM25Index in knowledge/rag_engine.py
# ISSUE-011: Replace Python in-memory BM25Index with mmap-backed Tantivy index
fulltext = [
    "dep:tantivy",
]

# HEIST-02: embedded_tor — in-process Tor via Arti (Rust Tor client).
# Eliminates external tor binary subprocess + SOCKS5 IPC overhead.
# M1 8GB: ~20-30 MB resident (consensus cache + circuits), ~15 MB compile.
# Python fallback: TorTransport (external tor binary) provides identical API.
# Requires: tokio runtime (shared with dns feature).
embedded_tor = [
    "dep:arti-client",
    "dep:tor-rtcompat",
    "dep:tokio",
]

# SILICON-03: nw_framework — Apple Network.framework user-space networking.
# Replaces BSD socket path with user-space TCP + hardware-accelerated TLS 1.3.
# For non-anti-bot clearnet targets (open APIs, CT logs, NoSQL ports).
# Requires: objc2 + block2 (Objective-C runtime + block support).
# Platform: aarch64-apple-darwin ONLY.
# M1 8GB: ~3 MB compile, ~200 KB resident. Pool: max 200 connections × 50 KB.
# Python fallback: existing curl_cffi/httpx path when unavailable.
nw_framework = [
    "dep:objc2",
    "dep:objc2-foundation",
    "dep:block2",
]

# pdf: PDF text extraction and IOC extraction via lopdf
# Adds: pdf.extract_text(), pdf.extract_iocs(), pdf.extract_text_from_bytes()
# M1 8GB: ~3MB compile, pure Rust, no external deps
# Python fallback: PyMuPDF in content_miner.py and document_metadata_extractor.py
pdf = [
    "dep:lopdf",
]

# office: Office document text extraction (.docx, .xlsx, .pptx) via docx-rs + calamine
# Adds: office.extract_text(), office.extract_iocs(), office.extract_text_from_bytes()
# M1 8GB: ~5MB compile, pure Rust, no external deps
# Python fallback: python-docx + openpyxl in content_miner.py
office = [
    "dep:docx-rs",
    "dep:calamine",
    "dep:zip",
]

# docx-rs: Pure Rust DOCX parser (no C dependencies)
# calamine: Pure Rust Excel (.xlsx) and PowerPoint (.pptx) parser

# ---------------------------------------------------------------------------
# Build profiles
# ---------------------------------------------------------------------------
# [profile.dev] opt-level = 1  →  ~3-5× faster incremental compiles on M1
# Reason: opt-level 3 (default release) compiles ~3 s per changed file;
#         opt-level 1 compiles ~0.5 s, same correctness, much faster iteration.
# [profile.release] stays opt-level 3 (thin LTO) for production performance.
[profile.dev]
opt-level = 1          # Fast dev iteration — same correctness, 3-5× faster
debug = false          # No debug info in dev (faster link)
lto = false           # No LTO in dev (faster incremental links)

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
strip = "symbols"
panic = "abort"

# ISSUE-P6-003 FIX: NEON target features are provided via TWO layers:
# 1. .cargo/config.toml [target.aarch64-apple-darwin] rustflags (cargo builds)
# 2. [tool.maturin.env] RUSTFLAGS in pyproject.toml (maturin builds)
# The [profile.release.build-override] was removed because it requires the
# unstable 'profile-rustflags' Cargo feature (not available in stable 1.97.1).
# Build override is no longer needed — the two layers above cover all build paths.
# [profile.release] — using .cargo/config.toml [profile.release] section instead


[build-dependencies]
pyo3-build-config = "0.29"

[lints.rust]
unused = "warn"
dead_code = "warn"
unused_imports = "warn"
unexpected_cfgs = "allow"

# [SWARM]-009 FIX: Clippy lint for unwrap/expect usage in non-test code.
# Run: cargo clippy -- -D clippy::unwrap_used
# Tests (#[cfg(test)]) are exempted via #[allow(clippy::unwrap_used)] in test modules.
[lints.clippy]
unwrap_used = "warn"

# ---------------------------------------------------------------------------
# Target-specific flags
# ---------------------------------------------------------------------------
# ISSUE E6: SIMD NEON on Apple Silicon M1/M2/M3
# R4-05 fix: NEON target-feature for aarch64.
#
# CRITICAL: Without +neon, core::arch::aarch64 intrinsics compile but emit
# NO actual SIMD ops — performance degrades to scalar (4-8× slower).
# +crypto: ARMv8 crypto extensions (AES, SHA1, SHA2 — used by sha2 crate)
#
# All Apple Silicon chips (M1+) support NEON and crypto extensions.
# These flags ensure the compiler emits NEON instructions rather than
# falling back to scalar code even when #[cfg(target_arch = "aarch64")]
# guards are present.
#
# NOTE: [target.aarch64-apple-darwin] rustflags fungují POUZE pro PŘÍMÉ
# cargo build mimo maturin. Maturin filtruje CARGO_* env vars, takže
# PRO MATURIN BUUDY je primární [tool.maturin.env] RUSTFLAGS v pyproject.toml
# a [profile.release.build-override] v tomto souboru. Tato sekce je záloha.
#
# Use explicit target triple [target.aarch64-apple-darwin] rather than
# [target.'cfg(target_arch = "aarch64")'] — the latter's rustflags key
# is silently ignored by Cargo (confirmed by "unused manifest key" warning).
[target.aarch64-apple-darwin]
rustflags = ["-C", "target-feature=+neon,+crypto"]
