[build-system]
requires = ["maturin>=1.0"]
build-backend = "maturin"

[project]
# UNderscore: Python packages use underscores, NOT hyphens
name = "hledac_rust_extensions"
version = "0.1.0"
# R6: PyO3 0.29 with abi3-py312: stable ABI wheel compatible with Python 3.12+
# (abi3 guarantees cross-version compatibility: 3.12, 3.13, 3.14).
# Free-threaded Python (3.13+) support: py.detach() is no-op when GIL disabled.
requires-python = ">=3.12"

[tool.maturin]
# PyO3 extension-module: cdylib for Python import
# NOTE: features here REPLACE Cargo.toml default features, not add to them.
# Must include all project features (core, data, bloom, graph, advanced) otherwise
# #[cfg(feature)] gated modules are compiled out but still referenced by other code.
features = ["pyo3/extension-module", "core", "data", "bloom", "graph", "advanced"]
# Module name matching the PyO3 #[pymodule] in src/lib.rs
module-name = "hledac_rust_extensions"
# Python package source (./hledac_rust_extensions/ subdirectory)
python-source = "."
# Strip debug symbols for M1 ARM64 smaller .so
strip = true
# Maturin build args — builds cdylib in release mode
build-args = ["--release", "--strip"]
# Cargo target-dir for incremental builds (cached between runs)
target-dir = "target/maturin"
