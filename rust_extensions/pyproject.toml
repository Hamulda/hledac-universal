[build-system]
requires = ["maturin>=1.0"]
build-backend = "maturin"

[project]
# UNderscore: Python packages use underscores, NOT hyphens
name = "hledac_rust_extensions"
version = "0.1.0"
# R6: PyO3 0.29 with extension-module ONLY (non-abi3 native wheel).
# ISSUE-014: Non-abi3 build targets Python 3.14 specifically, producing
# cp314-darwin-arm64 wheel with FULL Python C API access (tp_subclass,
# tp_new, native memory-view). Since project requires >=3.14 and M1 only,
# abi3 cross-version compatibility is unnecessary overhead.
# Free-threaded Python (3.13+) support: py.detach() is no-op when GIL disabled.
requires-python = ">=3.14"

[tool.maturin]
# PyO3 extension-module: cdylib for Python import
# NOTE: features here REPLACE Cargo.toml default features, not add to them.
# Must include all project features (core, data, bloom, graph, advanced) otherwise
# #[cfg(feature)] gated modules are compiled out but still referenced by other code.
# FIX NEW-H4: Include ALL default features from Cargo.toml:243 plus pyproject-specific ones.
# Without metal_shared, iosurface, swarm_dag the zero-copy IOSurface pipeline and
# work-stealing DAG are NOT compiled, causing silent Python fallback.
#
# Default Cargo features (Cargo.toml:243):
#   default = ["core", "data", "metal_shared", "iosurface", "swarm_dag"]
# Additional pyproject-specific:
#   pyo3/extension-module (required for cdylib builds)
#   bloom (referenced by core)
#   graph (not in default but used by this project)
#   advanced (not in default but used by this project)
features = [
    "pyo3/extension-module",
    "core",
    "data",
    "bloom",
    "graph",
    "advanced",
    "metal_shared",  # NEW-H4 fix: zero-copy Rust↔Python↔MLX buffer sharing
    "iosurface",     # NEW-H4 fix: CVPixelBuffer→Metal zero-copy pipeline
    "swarm_dag",     # NEW-H4 fix: work-stealing task DAG with ROI-based pool sizing
]
# Module name matching the PyO3 #[pymodule] in lib.rs
module-name = "hledac_rust_extensions"
# Python package source (./hledac_rust_extensions/ subdirectory)
python-source = "."
# Strip debug symbols for M1 ARM64 smaller .so
strip = true
# Maturin build args — builds cdylib in release mode
build-args = ["--release", "--strip"]
# Cargo target-dir for incremental builds (cached between runs)
target-dir = "target/maturin"

# ISSUE-P6-003 FIX: Předej RUSTFLAGS do cargo přes maturin env sekci.
#
# PROBLÉM: maturin filtruje CARGO_* env vars při volání cargo build.
# [target.aarch64-apple-darwin] rustflags = ["-C", "target-feature=+neon,+crypto"]
# v Cargo.toml je IGNOROVÁN maturinem — cargo nikdy nevidí CARGO_TARGET_* rustflags.
#
# ŘEŠENÍ: [tool.maturin] env sekce POSIX-friendly format:
#   RUSTFLAGS = "-C target-feature=+neon,+crypto"
# Toto maturin PŘEDÁ dál, protože jde přímo do cargo env (ne CARGO_ prefix).
#
# CANONICAL SOURCE: rust_extensions/.cargo/config.toml has the full rustflags config
# This pyproject.toml duplicates the flags for maturin builds only.
# Flags: +neon (SIMD), +crypto (+aes,+sha2) — M1 hardware acceleration
#
# VŠECHNY buildy přes maturin (develop i build) nyní dostanou +neon,+crypto.
# DuckDB path: maturin needs explicit -L for duckdb homebrew lib on M1.
[tool.maturin.env]
RUSTFLAGS = "-C target-feature=+neon,+crypto -L /opt/homebrew/opt/duckdb/lib"
