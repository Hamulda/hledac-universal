# .cargo/config.toml — macOS aarch64 build configuration for maturin
#
# With duckdb = { version = "1.105", features = ["bundled"] } in Cargo.toml,
# DuckDB source is compiled directly into the extension — no external libduckdb.dylib
# dependency, no version mismatch with Homebrew, and no -L/opt/homebrew/lib needed.
#
# CANONICAL SOURCE: This file is the source of truth for direct cargo builds.
# For maturin builds: pyproject.toml [tool.maturin.env] sets equivalent RUSTFLAGS.
# Both locations must be kept in sync for consistent builds.
#
# These rustflags supplement maturin's own link args (-undefined dynamic_lookup).
# build.rs also emits the same flags as a fallback for non-maturin builds.

[target.aarch64-apple-darwin]
rustflags = [
  # M1 optimization: NEON + AES + SHA2 target features
  # Issue #18: explicit target-feature ensures compiler emits NEON SIMD even when
  # target-cpu alone is insufficient (e.g. cross-compilation scenarios).
  # M1 has: NEON (SIMD), AES (crypto), SHA2 (hashing) — all in hardware.
  "-C", "target-cpu=apple-m1",
  "-C", "target-feature=+neon,+aes,+sha2",
  # Issue #26: M1-specific LLVM scheduler optimizations
  # enable-misched: enables the machine instruction scheduler for M1 micro-op scheduling
  # enable-loopinterchange: enables loop interchange for better cache locality
  "-C", "llvm-args=-enable-misched",
  "-C", "llvm-args=-enable-loopinterchange",
  # ISSUE-01: M1 8GB optimization — codegen-units=16 for parallel compilation
  "-C", "codegen-units=16",
  # Linker: allow undefined symbols (Python loads them at runtime)
  "-C", "link-arg=-undefined",
  "-C", "link-arg=dynamic_lookup",
]

[profile.release]
opt-level = 3
strip = true
# ISSUE-01: M1 8GB memory optimization
# lto = false: Disable LTO to save ~2GB RAM during compilation
# For full LTO: use thin (moderate RAM) or fat (2GB extra)
lto = false
codegen-units = 16
# SAFE-1 FIX: Removed panic = "abort" — .cargo/config.toml profile settings override
# Cargo.toml. With abort, catch_unwind becomes inert (panics → SIGABRT → kills Python).
# Cargo.toml:486 now sets panic = "unwind", enabling FFI safety infrastructure:
#   - ffi_safe! macro (madvise.rs:96)
#   - catch_unwind in ioc_extract.rs:176
#   - catch_unwind in graph_traverse/cache.rs:257
#   - catch_unwind_or_return() in ffi_safe.rs:171
