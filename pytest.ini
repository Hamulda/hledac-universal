[pytest]
# ISSUE-019: consolidated pytest configuration
# - testpaths includes tests/manual for debug/manual test artifacts
# - pythonpath anchors sys.path for all collection scenarios
# - markers for pytest-benchmark, integration, and Metal/Apple Silicon tests

testpaths = tests tests/manual scripts/debug
pythonpath = . tests

python_files = test_*.py *_test.py
python_classes = Test*
python_functions = test_*

# Auto-discovery: include scripts/debug/*.py as isolated benchmark/debug scripts
# (not auto-discovered as tests, must be run explicitly: pytest scripts/debug/)

# Suppress SwigPyObject/SwigPyPacked warnings from dspy C extension (3rd party)
filterwarnings =
    ignore::DeprecationWarning:swigpy

norecursedirs =
    .git .hg .svn .tox .nox .venv .venv-test venv env
    build dist htmlcov
    .pytest_cache .mypy_cache
    __pycache__ .benchmarks
    archive probe_* test_*_prefix_discipline

# --- Custom markers ---
# pytest-benchmark performance regression tracking
markers =
    benchmark: performance regression tests (requires pytest-benchmark)
    integration: requires external services (network, database, etc.)
    metal: requires Apple Silicon Metal GPU (MLX inference tests)
    slow: tests taking >5s in normal CI runs
    timeout: per-test timeout in seconds (overrides global default, TEST-01)
    flaky_race: tests that depend on real scheduler timing (non-deterministic)
    phase_gate: sprint tests auto-tagged by dynamic phase_gate discovery

# --- Timeout per test (prevent hanging on M1 8GB) ---
# TEST-01: Global default 120s — M1 thermal throttling on CI can cause
# brief CPU contention; 60s was too tight for integration tests.
# Per-test explicit @pytest.mark.timeout(N) overrides this.
timeout = 120

# --- Output options ---
console_output_style = progress
addopts = -p no:cacheprovider
