[pytest]
# ISSUE-019: consolidated pytest configuration
# ROADMAP-008: Optimized for M1 8GB with environment-aware parallelism
# - testpaths includes tests/manual for debug/manual test artifacts
# - pythonpath anchors sys.path for all collection scenarios
# - markers for pytest-benchmark, integration, and Metal/Apple Silicon tests
# - resource-based markers for hardware-aware test scheduling

testpaths = tests tests/manual scripts/debug
pythonpath = . tests

python_files = test_*.py *_test.py
python_classes = Test*
python_functions = test_*

# Auto-discovery: include scripts/debug/*.py as isolated benchmark/debug scripts
# (not auto-discovered as tests, must be run explicitly: pytest scripts/debug/)

# Suppress SwigPyObject/SwigPyPacked warnings from dspy C extension (3rd party)
filterwarnings =
    ignore::DeprecationWarning:swigpy

norecursedirs =
    .git .hg .svn .tox .nox .venv .venv-test venv env
    build dist htmlcov
    .pytest_cache .mypy_cache
    __pycache__ .benchmarks
    archive probe_* test_*_prefix_discipline

# --- Custom markers ---
# pytest-benchmark performance regression tracking
markers =
    benchmark: performance regression tests (requires pytest-benchmark)
    integration: requires external services (network, database, etc.)
    metal: requires Apple Silicon Metal GPU (MLX inference tests)
    slow: tests taking >5s in normal CI runs
    timeout: per-test timeout in seconds (overrides global default, TEST-01)
    flaky_race: tests that depend on real scheduler timing (non-deterministic)
    phase_gate: sprint tests auto-tagged by dynamic phase_gate discovery
    # --- Resource classification markers (ROADMAP-008) ---
    # HEAVY: Requires >2GB RAM, MLX models, GPU ops
    heavy: tests requiring >2GB RAM or MLX/GPU resources
    # LIGHT: Safe for M1 8GB constrained hardware
    light: tests safe for M1 8GB constrained hardware
    # CI: Full test suite for CI/CD pipelines
    ci: full test suite for CI/CD pipelines
    # PARALLEL_SAFE: Tests that can safely run in parallel with others
    parallel_safe: tests that don't conflict when run in parallel
    # SEQUENTIAL: Tests that must run alone (shared state, ports, resources)
    sequential: tests that must run alone (no parallelism)

# --- Timeout per test (prevent hanging on M1 8GB) ---
# TEST-01: Global default 300s — allows integration tests to complete
# Per-test explicit @pytest.mark.timeout(N) overrides this.
# CLI override: --timeout=N or HLEDAC_TEST_TIMEOUT=60
timeout = 300
# Thread-based timeout method — the default signal method is unsafe with asyncio
# tests (see conftest.py). Restores the timeout_method dropped by pyproject drift.
timeout_method = "thread"

# --- Output options ---
console_output_style = progress
# Note: parallelism (-n) is handled by conftest.py via --hledac-profile
# Default: no -n flag (let conftest decide based on profile)
# CLI can override: pytest -n auto, pytest -n 2, etc.
addopts = -p no:cacheprovider
