# pyproject.toml — Hledac Universal v18+
# MacBook Air M1 8GB — soukromý projekt, flat deps, žádné extras

[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "hledac-universal"
version = "18.0.0"
description = "Autonomous OSINT orchestrator for M1 MacBook — Ghost Prime"
readme = "README.md"
requires-python = ">=3.14,<3.16"
license = { text = "Proprietary" }
authors = [
    { name = "Vojtech Hamada", email = "vojtahamada@seznam.cz" }
]
keywords = ["osint", "autonomous", "orchestrator", "m1", "apple-silicon"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3.14",
    "Operating System :: Apple :: macOS",
    "Operating System :: Apple :: macOS :: macOS 14 Sonoma",
    "Operating System :: Apple :: macOS :: macOS 15 Sequoia",
]

dependencies = [
    # ── Core async ────────────────────────────────────────────────────────────
    "aiosqlite>=0.19.0",
    "aiohttp>=3.9.0",
    "aiofiles>=25.1.0",
    "aiohttp-socks>=0.11.0",
    "aioquic>=1.3.0",
    "uvloop>=0.22.1; sys_platform == 'darwin'",

    # ── HTTP / stealth ────────────────────────────────────────────────────────
    "httpx>=0.27.0",
    "curl-cffi>=0.15.0; sys_platform == 'darwin'",
    "brotlicffi>=1.2.0.1",
    "cloudscraper>=1.2.71",
    "camoufox; sys_platform == 'darwin'",
    "h2>=4.1.0",
    "httpx-socks>=0.10.0",
    "hishel>=0.0.31",

    # ── Serialization ─────────────────────────────────────────────────────────
    "orjson>=3.9.0",
    "msgspec>=0.21.1",
    "msgpack>=1.1.2",

    # ── Storage ───────────────────────────────────────────────────────────────
    "duckdb>=1.2.0",
    "lancedb>=0.33.0",
    "pyarrow>=24.0.0",
    "pandas>=3.0.3",
    "polars>=1.0.0",
    "lmdb>=2.2.0",
    "diskcache>=5.6.0",
    "redis>=8.0.0",

    # ── MLX / Apple Silicon ───────────────────────────────────────────────────
    "mlx>=0.31.2; sys_platform == 'darwin' and platform_machine == 'arm64'",
    "mlx-lm>=0.31.3; sys_platform == 'darwin' and platform_machine == 'arm64'",
    "mlx-embeddings>=0.1.0; sys_platform == 'darwin' and platform_machine == 'arm64'",

    # ── NER / NLP ─────────────────────────────────────────────────────────────
    "gliner2>=1.0.1",
    "fast-langdetect>=1.0.1",

    # ── Numerika / ML ─────────────────────────────────────────────────────────
    "numpy>=2.4.6",
    "scipy>=1.17.1",
    "scikit-learn>=1.9.0",
    "xgboost>=3.2.0",
    "lightgbm>=4.6.0",
    "transformers>=5.10.2",
    "dspy>=3.2.1",
    "outlines>=1.3.0",
    "xgrammar>=0.2.1",
    "flashrank>=0.2.10",
    "onnxscript>=0.7.0",

    # ── Vektorové indexy ──────────────────────────────────────────────────────
    "fastembed>=0.8.0",
    "hnswlib>=0.8.0",
    "usearch>=2.25.3",
    "datasketch>=1.10.0",
    "rank-bm25>=0.2.2",
    "rustworkx>=0.17.1",
    "networkx>=3.6.1",
    "python-igraph>=1.0.0",
    "rapidfuzz>=3.0.0",

    # ── Parsing / web scraping ────────────────────────────────────────────────
    "selectolax>=0.4.10",
    "beautifulsoup4>=4.14.3",
    "lxml>=6.1.1",
    "trafilatura",
    "markdownify",
    "feedparser",
    "duckduckgo-search>=8.0.0",

    # ── Dokumenty / OCR ───────────────────────────────────────────────────────
    "pymupdf>=1.27.2.3",
    "pypdf2",
    "python-docx",
    "pillow>=12.2.0",
    "ocrmac>=1.0.1; sys_platform == 'darwin'",
    "pytesseract>=0.3.10",

    # ── Apple frameworks (PyObjC) ─────────────────────────────────────────────
    "pyobjc-framework-cocoa>=12.2; sys_platform == 'darwin'",
    "pyobjc-framework-vision>=12.2; sys_platform == 'darwin'",
    "pyobjc-framework-quartz>=12.2; sys_platform == 'darwin'",
    "pyobjc-framework-naturallanguage>=12.2; sys_platform == 'darwin'",
    "pyobjc-framework-coreml>=12.2; sys_platform == 'darwin'",
    "pyobjc-framework-WebKit>=12.2; sys_platform == 'darwin'",
    "coremltools>=8.2",

    # ── Kryptografie ──────────────────────────────────────────────────────────
    "cryptography>=48.0.0",
    "pyopenssl>=26.2.0",
    "pyzipper>=0.3.6",
    "stem>=1.8.0",
    "liboqs-python>=0.15.0; platform_machine == 'arm64'",

    # ── Hashing / dedup / Bloom ───────────────────────────────────────────────
    "pyprobables>=0.7.0",
    "pybloom-live>=4.0.0",
    "xxhash>=3.7.0",
    "mmh3>=5.2.1",

    # ── Networking / OSINT ────────────────────────────────────────────────────
    "dnspython>=2.4.0",
    "ipwhois>=1.3.0",
    "yara-python>=4.5.4",
    "stix2>=3.0.1",
    "scapy>=2.5.0",
    "pyvis>=0.3.2",

    # ── Pattern matching ──────────────────────────────────────────────────────
    "pyahocorasick>=2.3.1",
    "ahocorasick-rs>=1.0.3",

    # ── Komprese ──────────────────────────────────────────────────────────────
    "zstandard>=0.25.0",
    "zstd>=1.5.7.3",
    "lz4",

    # ── Modely / datové struktury ─────────────────────────────────────────────
    "pydantic>=2.0.0",
    "pyyaml>=6.0,<7.0",
    "defusedxml",
    "diff-match-patch",
    "piexif",
    "PyWavelets>=1.7.0",
    "setproctitle",
    "zeroconf",
    "python-multipart>=0.0.32",

    # ── Monitorování / debug ──────────────────────────────────────────────────
    "psutil>=5.9.0",
    "debugpy>=1.8.21",

    # ── Testing (runtime) ─────────────────────────────────────────────────────
    "hypothesis<6.50",
    "resiliparse>=1.0.4",
]

[project.scripts]
hledac = "hledac.universal.__main__:main"

# ── Dev tools (oddělené od runtime, uv sync --group dev) ─────────────────────
[dependency-groups]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=1.4.0",
    "pytest-xdist>=3.5.0",
    "pytest-cov>=4.1.0",
    "pluggy>=1.0.0",
    "iniconfig>=2.0.0",
    "pygments>=2.15.0",
    "ruff>=0.1.0",
    "mypy>=1.9.0",
    "maturin>=1.0.0",
    "numpy>=1.24.0",
]

# ── Setuptools namespace ──────────────────────────────────────────────────────
[tool.setuptools]
packages = ["hledac.universal"]
package-dir = { "hledac.universal" = "." }

[tool.setuptools.package-data]
"hledac.universal" = ["py.typed"]

# ── uv ────────────────────────────────────────────────────────────────────────
[tool.uv]
python-preference = "managed"
package = true

# ── Ruff ─────────────────────────────────────────────────────────────────────
[tool.ruff]
line-length = 120
target-version = "py314"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "B", "C4", "DTZ", "T10", "ISC"]
ignore = ["E501", "F821", "B027"]

# ── Mypy ─────────────────────────────────────────────────────────────────────
[tool.mypy]
python_version = "3.14"
warn_return_any = true
warn_unused_configs = true
ignore_missing_imports = true

# ── ty ────────────────────────────────────────────────────────────────────────
[tool.ty.environment]
python-version = "3.14"
python-platform = "darwin"
extra-paths = [
    ".",
    "stubs",
    "/Users/vojtechhamada/PycharmProjects/Hledac",
    ".venv/lib/python3.14/site-packages",
]

[tool.ty.analysis]
allowed-unresolved-imports = [
    "pyprobables", "pyprobables.**",
    "ahocorasick",
    "kuzu",
    "outlines",
    "xgrammar",
    "coremltools",
    "pytesseract",
    "stem",
    "duckduckgo_search", "ddgs",
    "camoufox",
    "nodriver",
    "stix2",
    "scapy",
    "pyvis",
    "sentence_transformers",
    "mobileclip", "wasmtime", "spacy",
    "flashrank",
    "liboqs",
    "gliner2", "gliner",
    "hnswlib",
    "usearch",
    "rustworkx",
    "fastembed",
    "mlx", "mlx.**",
    "mlx_embeddings", "mlx_lm",
    "ocrmac",
    "Vision", "Vision.**",
    "NaturalLanguage", "NaturalLanguage.**",
    "Quartz", "Cocoa", "CoreML", "AppKit", "Foundation",
    "Metal", "MetalPerformanceShaders", "MetalPerformanceShadersGraph",
    "selectolax", "selectolax.tags",
    "pyxorfilter",
    "aioftp", "exifread", "trafilex", "traflatura", "openpyxl", "olevba",
    "lxml.html",
    "hledac.universal.federated", "hledac.universal.federated.**",
    "hledac.universal.autonomous_orchestrator",
    "hledac.universal.benchmarks.run_sprint82j_benchmark",
    "hledac.universal.orchestrator.global_scheduler",
    "hledac.universal.privacy_protection", "hledac.universal.privacy_protection.**",
    "hledac.tools.preserved_logic", "hledac.tools.preserved_logic.**",
    "hledac.supreme", "hledac.supreme.**",
    "hledac.cortex", "hledac.cortex.**",
    "inline_snapshot", "dirty_equals", "tests.utils",
]

# ── Pytest ────────────────────────────────────────────────────────────────────
[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-q --tb=short"
asyncio_mode = "auto"
