    # Live test fixtures (searxng local)
    "tests/live_8be/",
    # Archive subdirs (all archived historical tests)
    "tests/archive/probes/",
    "tests/archive/features/",
    "tests/archive/manual/",
    "tests/archive/transport/",
    "tests/archive/utils/",
]

# ── Resource-based markers (ROADMAP-008) ──────────────────────────────────────
# Tests are classified by resource requirements for hardware-aware scheduling.
#
# Usage:
#   pytest -m "not heavy"           # Run only light tests (M1 8GB default)
#   pytest -m "light"              # Explicit light only
#   pytest -m "heavy"              # Heavy tests only (explicit)
#   pytest -m "ci"                # Full CI suite
#   pytest                         # Default profile (configurable via --hledac-profile)
#
markers = [
    # ── Test type markers (existing) ─────────────────────────────────────────
    "asyncio: async tests handled by pytest-asyncio",
    "slow: slow tests, exclude with -m \"not slow\"",
    "live: tests requiring live network or external services",
    "integration: integration tests",
    "ghost_deleted: tests for deleted modules",
    "smoke: smoke tests",
    "mlx: Apple Silicon MLX tests",
    "torch: PyTorch tests",
    "browser: browser or Playwright tests",
    "hermetic: tests that must run without network or external services",
    "stress: stress/load tests, exclude from default local runs",
    "legacy: legacy tests for deprecated or migrated surfaces",
    "monolith: very large monolithic tests, run explicitly only",
    "archival: historical regression tests for old sprint contracts",
    "unit: unit tests, run in isolation without external dependencies",
    "parity: lane parity tests — must run sequentially (no xdist parallelism)",
    # ── Resource classification markers (ROADMAP-008) ───────────────────────
    # HEAVY: Requires >2GB RAM, MLX models, full DuckDB init, GPU ops
    #        Examples: MLX model pool tests, large vector tests, memory profiling
    "heavy: tests requiring >2GB RAM or MLX/GPU resources",
    # LIGHT: Safe for M1 8GB constrained hardware
    #        Examples: unit tests, mocks, pure Python logic, small data
    "light: tests safe for M1 8GB constrained hardware",
    # CI: Full test suite for CI/CD pipelines (all tests)
    "ci: full test suite for CI/CD pipelines",
    # PARALLEL_SAFE: Tests that can safely run in parallel with others
    "parallel_safe: tests that don't conflict when run in parallel",
    # SEQUENTIAL: Tests that must run alone (shared state, ports, resources)
    "sequential: tests that must run alone (no parallelism)",
]

# ── Parallelism configuration (ROADMAP-008) ───────────────────────────────────
# Default: auto-detect based on available CPU cores and memory.
# Override via CLI: pytest -n 2  OR  pytest -n auto
# Override via env: HLEDAC_TEST_WORKERS=2
#
# The --dist=loadscope groups tests by module to maximize fixture reuse.
# Session-scoped fixtures (DuckDB, OTel, event loop) are shared within each worker.
#
# NOTE: -n 4 with M1 8GB can cause OOM. Use --hledac-profile for presets:
#   pytest --hledac-profile=m1-8gb   # 2 workers, light tests only
#   pytest --hledac-profile=ci        # 4 workers, all tests
#   pytest --hledac-profile=minimal   # serial, light tests only
addopts = "-ra --tb=short --dist=loadscope"
asyncio_mode = "auto"
# Session-scoped event loop for pytest-asyncio (M1 8GB: reuse loop, avoid recreate)
# CRITICAL FIX F350M-R: must match session_event_loop fixture scope below
asyncio_default_fixture_loop_scope = "session"

[tool.codeclone]
# Audit trail
audit_enabled = true
audit_retention_days = 30

# Quality gates - Stage C: Strict protection
# Note: fail_on_new/fail_on_new_metrics disabled - existing debt in baseline
# Enable incrementally after fixing debt:
#   [DONE] 1. Fix captcha_solver duplicate - moved to .archive/deprecated/
#   [DONE] 2. Fix planning/__init__.py duplicated_branches (10 if-blocks → dispatch table)
#   3. Clean dead code (3238 items, mostly in .archive/deprecated/ - intentionally archived)
#   4. Break 7 dependency cycles
#   5. Refactor high-risk CC functions (111 with CC>20, max CC=139)
fail_health = -1
fail_cycles = false
fail_dead_code = false
fail_on_new = false      # Block NEW clones vs baseline (enable after fixing)
fail_on_new_metrics = false  # Block NEW debt additions (enable after cleanup)
fail_on_typing_regression = true
fail_on_docstring_regression = false
min_typing_coverage = 85
min_docstring_coverage = 80

# Analysis thresholds
min_loc = 10
min_stmt = 6

# Engineering Memory - Semantic Search
[tool.codeclone.memory.semantic]
enabled = true
backend = "lancedb"
embedding_provider = "fastembed"
embedding_model = "BAAI/bge-small-en-v1.5"

[tool.uv]
override-dependencies = ["whispercpp==0.0.17"]

[tool.uv.sources]
ruff-ext = { workspace = true }

[tool.hatch]
virtuals-reuse = true

[tool.hatch.workspace]
members = [".", "../ruff-ext", "ruff-ext"]
