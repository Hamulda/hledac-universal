# intelligence/stealth_crawler.py — cold-path init/setup
"intelligence/stealth_crawler.py" = ["BLE001"]
# discovery/ti_feed_adapter.py — cold-path feed parsing init
"discovery/ti_feed_adapter.py" = ["BLE001"]
# ── P1-01: remaining cold-path orchestrators / coordinators ────────────────────
# runtime/sprint_scheduler.py — F350M-R modular split; cold-path init/setup
"runtime/sprint_scheduler.py" = ["BLE001"]
# fetching/public_fetcher.py — cold-path fetch orchestration
"fetching/public_fetcher.py" = ["BLE001"]
# enhanced_research.py — cold-path research orchestration
