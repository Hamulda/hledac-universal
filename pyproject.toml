# pyproject.toml — Hledac Universal v18+
# MacBook Air M1 8GB — soukromý projekt, flat deps, žádné extras

[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "hledac-universal"
version = "18.0.0"
description = "Autonomous OSINT orchestrator for M1 MacBook — Ghost Prime"
readme = "README.md"
requires-python = ">=3.14,<3.15"
license = { text = "Proprietary" }
keywords = ["osint", "autonomous", "orchestrator", "m1", "apple-silicon"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3.14",
    "Operating System :: Apple :: macOS",
]

dependencies = [
    # ── Core async ────────────────────────────────────────────────────────────
    "aiosqlite>=0.19.0",
    "aiohttp>=3.11.0",
    "aiofiles>=25.1.0",
    "aiohttp-socks>=0.11.0",
    # aioquic removed P1-3: lives in [http3] extra only (~50-80MB resident, M1 8GB opt-in).
    # uvloop 0.22+ (F3.4): Python 3.14+ M1 wheel available since June 2026.
    # uvloop gives ~2× I/O-bound speedup vs native asyncio kqueue on M1.
    "uvloop>=0.22; sys_platform == 'darwin' and platform_machine == 'arm64'",
    # ── HTTP / stealth ────────────────────────────────────────────────────────
    "httpx>=0.28.0",
    "curl-cffi>=0.15.0; sys_platform == 'darwin'",
    "brotlicffi>=1.2.0.1",
    "cloudscraper>=1.2.71",
    "camoufox; sys_platform == 'darwin'",
    "h2>=4.1.0",
    "httpx-socks>=0.10.0",
    "hishel>=0.0.31",
    # ── Serialization ─────────────────────────────────────────────────────────
    "orjson>=3.10.0",
    "msgspec>=0.21.1",
    "msgpack>=1.1.2",
    # ── Storage ───────────────────────────────────────────────────────────────
    # NOTE: DuckDB maintains backward compatibility within major version (1.x).
    # Python duckdb 1.5.x is backward-compatible with DuckDB 1.10.x files.
    # rust_extensions bundles DuckDB 1.10.5 C++ source; no ABI conflict exists.
    "duckdb>=1.5.0,<1.12.0",
    "lancedb>=0.33.0",
    # Issue 4.3: sqlite-vec fallback for semantic_store — zero-process ANN on M1 8GB
    "sqlite-vec>=0.1.0",
    "pyarrow>=24.0.0",
    "pandas>=3.0.3",
    "polars>=1.0.0",
    "lmdb>=2.2.0",
    "diskcache>=5.6.0",
    "redis>=8.0.0",
    # ── MLX / Apple Silicon ───────────────────────────────────────────────────
    # NOTE: mlx + mlx-lm exact pins come from uv.lock; >= here allows range resolution.
    # MLX_ENABLE_MLX=1 gate in runtime.
    "mlx>=0.31.2; sys_platform == 'darwin' and platform_machine == 'arm64'",
    "mlx-lm>=0.31.3; sys_platform == 'darwin' and platform_machine == 'arm64'",
    # F320: mlx-lm 0.31.x is installed with transformers 4.57.6 (not 5.x) in .venv.
    # mlx-lm METADATA incorrectly specifies transformers>=5.0.0 but runtime works with 4.x.
    # After uv sync, if transformers upgrades to 5.x, mlx_lm.load will break.
    # Fix: run: uv pip install 'transformers>=4.30,<5.0' to downgrade.
    "mlx-embeddings; sys_platform == 'darwin' and platform_machine == 'arm64'",
    # ── NER / NLP ─────────────────────────────────────────────────────────────
    "gliner2>=1.0.1",
    "mlx-gliner2>=0.1.1; sys_platform == 'darwin' and platform_machine == 'arm64'",
    "fast-langdetect>=1.0.1",
    # ── Numerika / ML ─────────────────────────────────────────────────────────
    "numpy>=2.4.6",
    "scipy>=1.17.1",
    "scikit-learn>=1.9.0",
    "xgboost>=3.2.0",
    "lightgbm>=4.6.0",
    "xgrammar>=0.2.1",
    "onnxscript>=0.7.0",
    # ── Vektorové indexy ──────────────────────────────────────────────────────
    # fastembed REMOVED P0-1: MLXEmbeddingManager is primary for M1; fastembed was fallback only
    "hnswlib>=0.8.0",
    "usearch>=2.25.3",
    "datasketch>=1.10.0",
    "python-dotenv>=1.0.0",
    "rank-bm25>=0.2.2",
    "rustworkx>=0.17.1",
    "networkx>=3.6.1",
    "python-igraph>=1.0.0",
    "rapidfuzz>=3.0.0",
    # ── Parsing / web scraping ────────────────────────────────────────────────
    "selectolax>=0.4.10",
    "beautifulsoup4>=4.14.3",
    "lxml>=6.1.1",
    "trafilatura",
    "markdownify",
    # ── Dokumenty / OCR ───────────────────────────────────────────────────────
    "pymupdf>=1.27.2.3",
    "pypdf2",
    "python-docx",
    "pillow>=12.2.0",
    "ocrmac>=1.0.1; sys_platform == 'darwin'",
    "pytesseract>=0.3.10",
    # ── Reporting / templating (Issue 12.1)
    "jinja2>=3.1.0",
    "markdown-it-py>=3.0.0",
    # ── Apple frameworks (PyObjC) ─────────────────────────────────────────────
    "pyobjc-framework-cocoa>=12.2; sys_platform == 'darwin'",
    "pyobjc-framework-vision>=12.2; sys_platform == 'darwin'",
    "pyobjc-framework-quartz>=12.2; sys_platform == 'darwin'",
    "pyobjc-framework-naturallanguage>=12.2; sys_platform == 'darwin'",
    "pyobjc-framework-coreml>=12.2; sys_platform == 'darwin'",
    "pyobjc-framework-WebKit>=12.2; sys_platform == 'darwin'",
    # Python 3.14: both 8.x and 9.x lack wheels; upper bound needed for ANE ops (macOS SDK 15+)
    "coremltools>=8.0,<10.0",
    # ── Kryptografie ──────────────────────────────────────────────────────────
    "cryptography>=48.0.0",
    "pyopenssl>=26.2.0",
    "pyzipper>=0.3.6",
    "stem>=1.8.0",
    "liboqs-python>=0.15.0; platform_machine == 'arm64'",
    # ── Hashing / dedup / Bloom ───────────────────────────────────────────────
    "pyprobables>=0.7.0",
    "xxhash>=3.7.0",
    "mmh3>=5.2.1",
    # ── Networking / OSINT ────────────────────────────────────────────────────
    "dnspython>=2.4.0",
    "ipwhois>=1.3.0",
    "yara-python>=4.5.4",
    "stix2>=3.0.1",
    "scapy>=2.5.0",
    "pyvis>=0.3.2",
    # ── Pattern matching ──────────────────────────────────────────────────────
    "pyahocorasick>=2.3.1",
    "ahocorasick-rs>=1.0.3",
    # ── IPC / shared memory (M1 zero-copy cross-process) ─────────────────────
    'posix-ipc>=1.1.1; sys_platform == "darwin"',
    # ── Komprese ──────────────────────────────────────────────────────────────
    "zstandard>=0.25.0",
    "zstd>=1.5.7.3",
    "lz4",
    # ── Modely / datové struktury ─────────────────────────────────────────────
    "pydantic>=2.10.0",
    "pyyaml>=6.0",
    "defusedxml",
    "diff-match-patch",
    "piexif",
    "PyWavelets>=1.7.0",
    "setproctitle",
    "zeroconf",
    "python-multipart>=0.0.32",
    # ── Monitorování / debug ──────────────────────────────────────────────────
    "psutil>=5.9.0",
    "debugpy>=1.8.21",
    # ── OpenTelemetry (Sprint T1) — always-on tracing, M1 8GB safe ──────────
    # Manual span wrapping only (no asyncio auto-instrumentation) to keep
    # overhead bounded. Default exporter: JSON-Lines to stdout. OTLP/HTTP
    # exporter via [otel-otlp] extra.
    "opentelemetry-api>=1.27.0",
    "opentelemetry-sdk>=1.27.0",
    # F4.6: httpx + aiohttp instrumentation (auto-instr excluded per pyproject constraint)
    "opentelemetry-instrumentation-httpx>=0.47b0",
    # Issue 10.2: structlog (optional — stdlib fallback when unavailable)
    "structlog>=24.0.0",
    # Issue 10.2: OTLP HTTP exporter (for otel collector)
    "opentelemetry-exporter-otlp-proto-http>=1.27.0",
    "cachetools>=7.1.4",
]

[project.optional-dependencies]
# Issue 10: observability extras — OTLP + profiling
observability = [
    "structlog>=24.0.0",
    "opentelemetry-instrumentation-aiohttp-client>=0.47b0",
    "opentelemetry-exporter-otlp-proto-http>=1.27.0",
    # Memory profiling (dev)
    "memray>=1.14.0",
    # CPU profiling (dev)
    "py-spy>=0.3.14",
]
# ── Optional ML extras ───────────────────────────────────────────────────────
# Install with: uv sync --extra ml
ml = [
    # DSPy compiled programs (HLEDAC_ENABLE_DSPY=1)
    "dspy>=3.2.1",
    # Structured generation + grammar-constrained decoding
    "outlines>=1.3.0",
    # Vision OCR (TrOCR), ANE/CoreML embedder fallbacks
    "transformers>=5.10.2",
    # Re-ranker for semantic search
    "flashrank>=0.2.10",
]
mlx-embed = [
    # MLX-native embedding (M1 unified memory, no subprocess, no conversion)
    # NOTE: exact mlx pin matches [project] main mlx pin — no version conflict.
    "mlx>=0.31.2; sys_platform == 'darwin' and platform_machine == 'arm64'",
    "mlx-embedding-models>=0.0.1; sys_platform == 'darwin' and platform_machine == 'arm64'",
]
http3 = [
    # Real QUIC lane for stealth/DA+ profiles (M1 8GB: ~50-80 MB resident).
    # INSTALL WITH: uv sync --extra http3  (NOT automatic — opt-in only)
    "aioquic>=1.3.0",
    "cryptography>=48.0.0",  # Matches main [project.dependencies] version
]
m1-local = [
    # M1-specific fallbacks (no aioquic — it lives in [http3] extra for M1 8GB).
    # aioquic is ~50-80MB resident and should ONLY be installed via:
    #   uv sync --extra http3
    # This keeps the default M1 8GB footprint minimal.
]
nogil = [
    # F5.1: Free-threaded Python 3.14+ (PEP 703) support.
    # Enables true multi-core parallelism in Rust extensions WITHOUT Python GIL.
    # Impact: 7-8 M1 cores for CPU-bound work (graph traversal, simhash, etc.)
    # Requires: Python 3.14+ built with --disable-gil (Py_GIL_DISABLED=1).
    # Install with: uv sync --extra nogil
    # NOTE: PyO3 is NOT a pip package — it's a Rust crate bundled in
    # rust_extensions/Cargo.toml (compiled via maturin). This extra only
    # documents the nogil feature for type checkers / CI. The actual
    # PyO3 version is managed by rust_extensions/Cargo.toml.
]

[project.scripts]
hledac = "hledac.universal.__main__:main"
check-silent-excepts = "hledac.universal.scripts.check_silent_excepts:main"

# ── Dev tools (oddělené od runtime, uv sync --group dev) ─────────────────────
[dependency-groups]
dev = [
    # ── Testing ────────────────────────────────────────────────────────────────
    "pytest>=8.0.0",
    "pytest-asyncio>=1.4.0",
    "pytest-xdist>=3.5.0",
    "pytest-cov>=4.1.0",
    "pytest-benchmark>=4.0.0",  # Hot-path benchmarks, fail if regress >10%
    "pytest-timeout>=2.3.0",
    "hypothesis>=6.0.0,<6.50",  # Moved from [project] — test-only
    "resiliparse>=1.0.4",        # Test HTML parsing
    # ── Audit / security ────────────────────────────────────────────────────
    "pip-audit>=2.8.0",          # CVE scanning; run: uv run pip-audit
    "pip-check>=2.10.0",         # Weekly outdated-dep check; run: uv run pip-check
    # ── Dev tooling ─────────────────────────────────────────────────────────
    "pluggy>=1.0.0",
    "iniconfig>=2.0.0",
    "pygments>=2.15.0",
    "ruff>=0.1.0",
    "maturin>=1.0.0",
    "numpy>=1.24.0",
    "pyright>=1.1.410",
    "ty>=0.0.49",
    # ── Test-only extras (used in tests / probes only) ──────────────────────
    "ddgs>=9.14.4",
    "sentence-transformers>=5.5.1",
    "ijson>=3.5.0",
    "kuzu>=0.11.3",
    "pybloom-live>=4.0.0",
]

# ── Setuptools namespace ──────────────────────────────────────────────────────
[tool.setuptools]
packages = ["hledac.universal"]
package-dir = { "hledac.universal" = "." }

[tool.setuptools.package-data]
"hledac.universal" = ["py.typed"]

# ── uv ────────────────────────────────────────────────────────────────────────
[tool.uv]
python-preference = "managed"
package = true

# rust_extensions workspace member — maturin build for PyO3 cdylib
# Build: uv run maturin develop --manifest-path rust_extensions/Cargo.toml --release
# CI pre-built wheels: .github/workflows/rust-extensions.yml (aarch64-apple-darwin)
["tool.uv.sources"]
"hledac-rust-extensions" = { path = "rust_extensions" }

[tool.uv.workspace]
members = ["rust_extensions"]

# ── Ruff ─────────────────────────────────────────────────────────────────────
[tool.ruff]
line-length = 120
target-version = "py314"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "B", "C4", "DTZ", "T10", "ISC"]
ignore = ["E501", "F821", "B027"]

[tool.ruff.lint.per-file-ignores]
# stubs/ – Apple/CoreML framework .pyi binding files; preserve original names
"stubs/**" = []
# core/rust_backend.py – FFI wrappers whose names MUST match Rust counterparts
"core/rust_backend.py" = ["N801", "N802", "N803", "N806", "N815", "N816"]
# brain/experimental_neuro_crypto.py – neurophysiology equations (Hodgkin-Huxley model),
# variable names like I_Na, g_K, V, m, h, n are domain-standard notation
"brain/experimental_neuro_crypto.py" = ["N803", "N806"]
# tests/transports/ – InMemoryTransport is test-only (TST001 = import-from-tests guard)
"tests/transports/**" = []

# ── Mypy ─────────────────────────────────────────────────────────────────────
[tool.mypy]
python_version = "3.14"
warn_return_any = true
warn_unused_configs = true
ignore_missing_imports = true
explicit_package_bases = true

# ── Pyright ───────────────────────────────────────────────────────────────────
# Python 3.14+ project configuration
# Consolidated from pyrightconfig.json
# type:ignore comments are intentional for PyO3 bindings, dynamic attrs, and optional deps
[tool.pyright]
pythonVersion = "3.14"
platform = "Darwin"
typeCheckingMode = "basic"
reportMissingImports = "warning"
reportMissingTypeStubs = false
reportUnknownMemberType = "none"
reportUntypedClassDecorator = "none"
reportUntypedFunctionDecorator = "none"
enableTypeIgnoreComments = true
# venv from pyrightconfig.json (venvPath + venv combined)
venvPath = "."
venv = ".venv"
# Exclude test/probe dirs (heavy external deps with many type:stubs)
exclude = [
    "tests/",
    "probe_*/",
    "evaluate/",
    ".venv*/",
    ".venv-test/",
    "build/",
    "dist/",
    ".mypy_cache/",
    ".ruff_cache/",
    "stubs/",
]
# Extra paths for namespace package resolution (matches [tool.ty.environment])
extraPaths = [
    ".",
    "stubs",
]

# ── ty ────────────────────────────────────────────────────────────────────────
[tool.ty.environment]
python-version = "3.14"
python-platform = "darwin"
extra-paths = [
    ".",
    "stubs",
    "/Users/vojtechhamada/PycharmProjects/Hledac",
    ".venv/lib/python3.14/site-packages",
]

[tool.ty.analysis]
allowed-unresolved-imports = [
    "pyprobables", "pyprobables.**",
    "ahocorasick",
    "posix_ipc",
    "kuzu",
    "outlines",
    "xgrammar",
    "coremltools",
    "pytesseract",
    "stem",
    "duckduckgo_search", "ddgs",
    "camoufox",
    "nodriver<0.50",  # F265C: >=0.50 has UTF-8 bug in cdp/network.py on Py 3.14
    "stix2",
    "scapy",
    "pyvis",
    "mobileclip", "wasmtime", "spacy",
    "flashrank",
    "liboqs",
    "gliner2", "gliner",
    "mlx_gliner2",
    "mlx_gliner2",
    "hnswlib",
    "usearch",
    "rustworkx",
    # fastembed REMOVED P0-1: MLXEmbeddingManager is primary for M1
    "mlx", "mlx.**",
    "mlx_embeddings", "mlx_lm",
    "ocrmac",
    "Vision", "Vision.**",
    "NaturalLanguage", "NaturalLanguage.**",
    "Quartz", "Cocoa", "CoreML", "AppKit", "Foundation",
    "Metal", "MetalPerformanceShaders", "MetalPerformanceShadersGraph",
    "selectolax", "selectolax.tags",
    "pyxorfilter",
    "aioftp", "exifread", "trafilex", "traflatura", "openpyxl", "olevba",
    "lxml.html",
    "hledac.universal.federated", "hledac.universal.federated.**",
    "hledac.universal.benchmarks.run_sprint82j_benchmark",
    "hledac.universal.orchestrator.global_scheduler",
    "hledac.universal.privacy_protection", "hledac.universal.privacy_protection.**",
    "hledac.tools.preserved_logic", "hledac.tools.preserved_logic.**",
    "hledac.supreme", "hledac.supreme.**",
    "hledac.cortex", "hledac.cortex.**",
    "inline_snapshot", "dirty_equals", "tests.utils",
]

# ── Pytest ────────────────────────────────────────────────────────────────────
# Consolidated from pytest.ini
[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

python_files = [
    "test_*.py",
    "*_test.py",
]
python_classes = ["Test*"]
python_functions = ["test_*"]

# Suppress SwigPyObject/SwigPyPacked warnings from dspy C extension (3rd party)
filterwarnings = [
    "ignore::DeprecationWarning:swigpy",
]

norecursedirs = [
    ".git",
    ".hg",
    ".svn",
    ".tox",
    ".nox",
    ".venv",
    ".venv-test",
    "venv",
    "env",
    "build",
    "dist",
    "htmlcov",
    ".pytest_cache",
    ".mypy_cache",
    ".ruff_cache",
    ".hypothesis",
    "__pycache__",
    "node_modules",
    "artifacts",
    "reports",
    "archive",
    "tmp",
    "temp",
    "rust_extensions/.venv",
]

markers = [
    "asyncio: async tests handled by pytest-asyncio",
    "slow: slow tests, exclude with -m \"not slow\"",
    "live: tests requiring live network or external services",
    "integration: integration tests",
    "ghost_deleted: tests for deleted modules",
    "smoke: smoke tests",
    "mlx: Apple Silicon MLX tests",
    "torch: PyTorch tests",
    "browser: browser or Playwright tests",
    "hermetic: tests that must run without network or external services",
    "stress: stress/load tests, exclude from default local runs",
    "legacy: legacy tests for deprecated or migrated surfaces",
    "monolith: very large monolithic tests, run explicitly only",
    "archival: historical regression tests for old sprint contracts",
    "unit: unit tests, run in isolation without external dependencies",
]

# M1 4-performance-cores: -n 4 with loadscope distribution
# --dist=loadscope: tests grouped by class/module, workers keep same module loaded
# -ra: show summary of all test results
addopts = "-ra --tb=short -n 4 --dist=loadscope"
asyncio_mode = "auto"
# Session-scoped event loop for pytest-asyncio (M1 8GB: reuse loop, avoid recreate)
asyncio_default_fixture_loop_scope = "session"
