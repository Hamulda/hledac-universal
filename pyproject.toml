# pyproject.toml — Hledac Universal v18+
# MacBook Air M1 8GB — soukromý projekt, flat deps, žádné extras

[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "hledac-universal"
version = "18.0.0"
description = "Autonomous OSINT orchestrator for M1 MacBook — Ghost Prime"
readme = "README.md"
requires-python = ">=3.14,<3.15"
license = { text = "Proprietary" }
keywords = ["osint", "autonomous", "orchestrator", "m1", "apple-silicon"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3.14",
    "Operating System :: Apple :: macOS",
]

dependencies = [
    # ── Core async ────────────────────────────────────────────────────────────
    "aiosqlite>=0.19.0",
    # aiodns: c-ares backed async DNS — 2-5× faster parallel resolution vs loop.getaddrinfo.
    # Uses connection multiplexing for multiple queries to the same nameserver.
    # M1 8GB: ~5 MB resident (single c-ares channel), lazy import, always-on.
    "aiodns>=4.0.0; sys_platform == 'darwin'",
    # aiohttp REMOVED F4XX: primary transport = curl_cffi (stealth, JA3).
    # httpx handles HTTP/2 natively (h2 bundled internally).
    # Tor/I2P use httpx-socks exclusively (connection_pool_manager.py, tor/i2p_transport).
    # For development/testing only: uv sync --extra aiohttp-fallback
    "aiofiles>=25.1.0",
    # aioquic removed P1-3: lives in [http3] extra only (~50-80MB resident, M1 8GB opt-in).
    # uvloop 0.22+ (F3.4): Python 3.14+ M1 wheel available since June 2026.
    # uvloop gives ~2× I/O-bound speedup vs native asyncio kqueue on M1.
    "uvloop>=0.22; sys_platform == 'darwin' and platform_machine == 'arm64'",
    # ── HTTP / stealth ────────────────────────────────────────────────────────
    # httpx<0.30.0: HTTP/2 stable in 0.28.x; upper bound prevents 1.x breaking changes
    "httpx>=0.28.0,<0.30.0",
    "curl-cffi>=0.15.0,<1.0.0; sys_platform == 'darwin'",
    "brotlicffi>=1.2.0.1",
    "cloudscraper>=1.2.71",
    # camoufox REMOVED F330: nodriver (CDP-direct) + playwright 2-tab pool
    # (~150MB RAM cap on M1 8GB) covers all browser fingerprinting needs.
    # camoufox added redundant Firefox-specific surface area for marginal gain.
    # If explicitly needed: HLEDAC_ENABLE_CAMOUFOX=1 + install manually.
    # h2 REMOVED F3XX: httpx bundles h2 internally — no need for explicit dep.
    # HTTP/2 is enabled by default in httpx >= 0.28.0.
    # httpx-socks<0.12.0: API stable in 0.11.x; AsyncProxyTransport used by Tor/I2P
    "httpx-socks>=0.10.0,<0.12.0",
    # hishel<2.0.0: API stable in 1.x; upper bound prevents 2.x breaking changes
    "hishel>=0.0.31,<2.0.0",
    "aiosqlite>=0.20.0",  # hishel dependency for AsyncSqliteStorage
    # ── Serialization ─────────────────────────────────────────────────────────
    "orjson>=3.10.0",
    # UPGRADE 2026-07-05: msgspec 0.22.x is backward-compatible, adds fixes.
    # NOTE: 0.22.0 not yet available for Python 3.14 — requires 0.21.x
    "msgspec>=0.21.1,<0.23.0",
    "msgpack>=1.1.2",
    # F3XX: Retry modernization — replaces manual exponential-backoff retry loops
    "tenacity>=9.0.0",
    # ── Storage ───────────────────────────────────────────────────────────────
    # NOTE: DuckDB maintains backward compatibility within major version (1.x).
    # Python duckdb 1.5.x is backward-compatible with DuckDB 1.10.x files.
    # rust_extensions bundles DuckDB 1.10.5 C++ source; no ABI conflict exists.
    # UPGRADE 2026-07-05: Extended upper bound to <2.0.0 for DuckDB 1.10+ support.
    "duckdb>=1.5.0,<2.0.0",
    "lancedb>=0.33.0,<0.35.0",
    # Issue 4.3: sqlite-vec fallback for semantic_store — zero-process ANN on M1 8GB
    "sqlite-vec>=0.1.0",
    "pyarrow>=24.0.0,<25.0.0",
    "polars>=1.0.0,<2.0.0",
    "lmdb>=2.2.0",
    "diskcache>=5.6.0",
    # ── MLX / Apple Silicon ───────────────────────────────────────────────────
    # NOTE: mlx + mlx-lm exact pins come from uv.lock; >= here allows range resolution.
    # MLX_ENABLE_MLX=1 gate in runtime.
    "mlx>=0.31.2; sys_platform == 'darwin' and platform_machine == 'arm64'",
    "mlx-lm>=0.31.3; sys_platform == 'darwin' and platform_machine == 'arm64'",
    # Issue #50: mlx-lm 0.31.x METADATA incorrectly specifies transformers>=5.0.0.
    # Actual runtime: works with both 4.x and 5.x (tested with 5.13.0).
    # Pin spodní hranice pro stabilitu — [ml] extra separately vyžaduje 5.x pro DSPy.
    "transformers>=4.30",
    "mlx-embeddings; sys_platform == 'darwin' and platform_machine == 'arm64'",
    # ── NER / NLP ─────────────────────────────────────────────────────────────
    "gliner2>=1.0.1",
    "mlx-gliner2>=0.1.1; sys_platform == 'darwin' and platform_machine == 'arm64'",
    "fast-langdetect>=1.0.1",
    # ── Numerika / ML ─────────────────────────────────────────────────────────
    "numpy>=2.4.6",
    "scipy>=1.17.1",
    "scikit-learn>=1.9.0",
    "xgboost>=3.2.0",
    "lightgbm>=4.6.0",
    "xgrammar>=0.2.1",
    "onnxscript>=0.7.0",
    # ── Vektorové indexy ──────────────────────────────────────────────────────
    # fastembed REMOVED P0-1: MLXEmbeddingManager is primary for M1; fastembed was fallback only
    # hnswlib REMOVED P1-9: usearch is primary (M1 Metal SIMD, smaller footprint)
    "usearch>=2.25.3",
    "datasketch>=1.10.0",
    "python-dotenv>=1.0.0",
    "rank-bm25>=0.2.2",
    # UPGRADE 2026-07-05: Extended upper bound to <0.20.0 for rustworkx 0.18+ support.
    "rustworkx>=0.17.1,<0.20.0",
    "python-igraph>=1.0.0",
    "rapidfuzz>=3.0.0",
    # ── Parsing / web scraping ────────────────────────────────────────────────
    # selectolax PRIMARY: fast, pure Python, CSS selectors (M1 8GB friendly).
    # lxml FALLBACK: only for complex XPath queries (selectolax cannot do //a/@href).
    "selectolax>=0.4.10",
    "beautifulsoup4>=4.14.3",
    "lxml>=6.1.1",
    "markdownify",
    # ── Dokumenty / OCR ───────────────────────────────────────────────────────
    "pymupdf>=1.27.2.3",
    "pypdf2",
    "python-docx",
    "pillow>=12.2.0",
    "ocrmac>=1.0.1; sys_platform == 'darwin'",
    "pytesseract>=0.3.10",
    # ── Reporting / templating (Issue 12.1)
    "jinja2>=3.1.0",
    "markdown-it-py>=3.0.0",
    # ── Apple frameworks (PyObjC) ─────────────────────────────────────────────
    "pyobjc-framework-cocoa>=12.2; sys_platform == 'darwin'",
    "pyobjc-framework-vision>=12.2; sys_platform == 'darwin'",
    "pyobjc-framework-quartz>=12.2; sys_platform == 'darwin'",
    "pyobjc-framework-naturallanguage>=12.2; sys_platform == 'darwin'",
    "pyobjc-framework-coreml>=12.2; sys_platform == 'darwin'",
    "pyobjc-framework-WebKit>=12.2; sys_platform == 'darwin'",
    # Python 3.14: both 8.x and 9.x lack wheels; upper bound needed for ANE ops (macOS SDK 15+)
    "coremltools>=8.0,<10.0",
    # ── Kryptografie ──────────────────────────────────────────────────────────
    "cryptography>=48.0.0",
    "pyzipper>=0.3.6",
    "stem>=1.8.0",
    "liboqs-python>=0.15.0; platform_machine == 'arm64'",
    # ── Hashing / dedup / Bloom ───────────────────────────────────────────────
    "pyprobables>=0.7.0",
    # xxhash 3.x is stable. 4.x has breaking API changes (module restructure).
    # IMPORTANT: Use xxhash.xxh3_64() (xxHash3-64, SIMD) — compatible with Rust xxh3_64.
    # Exceptions (xxh64 acceptable):
    #   - Bloom filter: uses seeded xxh64 for double-hashing technique (bloom_filter.py)
    #   - IOC internal IDs: own namespace, not cross-language (duckdb_store, ioc_graph, ioc_extract)
    "xxhash>=3.7.0,<4.0.0",
    "mmh3>=5.2.1",
    # ── Networking / OSINT ────────────────────────────────────────────────────
    "dnspython>=2.4.0",
    "ipwhois>=1.3.0",
    "yara-python>=4.5.4",
    "stix2>=3.0.1",
    "scapy>=2.5.0",
    "pyvis>=0.3.2",
    # ── Pattern matching ──────────────────────────────────────────────────────
    "pyahocorasick>=2.3.1",
    "ahocorasick-rs>=1.0.3",
    # ── IPC / shared memory (M1 zero-copy cross-process) ─────────────────────
    'posix-ipc>=1.1.1; sys_platform == "darwin"',
    # ── Komprese ──────────────────────────────────────────────────────────────
    "zstandard>=0.25.0",
    "zstd>=1.5.7.3",
    "lz4",
    # ── Modely / datové struktury ─────────────────────────────────────────────
    # Issue #49: upper bound prevents accidental upgrade to v3 (ABI break).
    # Audit [ml] extra: transformers>=5.10.2 (5.x), dspy>=3.2.1, outlines>=1.3.0,
    # flashrank>=0.2.10 — none require pydantic; uv.lock confirms pydantic 2.x only.
    "pydantic>=2.10.0,<3.0.0",
    "pyyaml>=6.0",
    "defusedxml",
    "diff-match-patch",
    "piexif",
    "PyWavelets>=1.7.0",
    "setproctitle",
    "zeroconf",
    "python-multipart>=0.0.32",
    # ── Monitorování / debug ──────────────────────────────────────────────────
    "psutil>=5.9.0",
    "debugpy>=1.8.21",
    # ── OpenTelemetry (Sprint T1) — always-on tracing, M1 8GB safe ──────────
    # Manual spans via otel.span() — M1 8GB safe. httpx auto-instr via
    # HLEDAC_OTEL_PROFILE=1. Default exporter: JSON-Lines to stdout.
    # OTLP/HTTP exporter via [otel-otlp] extra.
    "opentelemetry-api>=1.27.0,<2.0.0",
    "opentelemetry-sdk>=1.27.0,<2.0.0",
    # httpx auto-instrumentation via HLEDAC_OTEL_PROFILE=1 (~1MB, M1-safe).
    # aiohttp instrumentation removed — aiohttp is now [aiohttp-fallback] extra only
    "opentelemetry-instrumentation-httpx>=0.47b0",
    # Issue 10.2: structlog (optional — stdlib fallback when unavailable)
    "structlog>=24.0.0,<25.0.0",
    # Issue 10.2: OTLP HTTP exporter (for otel collector)
    "opentelemetry-exporter-otlp-proto-http>=1.27.0",
    # Issue 10.2: Logfire for local dev observability (M1 8GB safe)
    "logfire[observability]>=2.0.0",
    # Issue 10.2: OTel instrumentation for async libraries
    # Optional instrumentation — enable via pip install separately if needed
    "opentelemetry-instrumentation-aio-pika[observability]>=0.47b0",
    "opentelemetry-instrumentation-asyncpg[observability]>=0.47b0",
    "cachetools>=7.1.4",
    "pydantic-settings>=2.14.2",
    "roampal>=0.5.7",
]

[project.optional-dependencies]
# Issue 10: observability extras — OTLP + profiling
observability = [
    "structlog>=24.0.0,<25.0.0",
    # asyncio instrumentation NOT included — 5-15% event-loop overhead on M1
    # httpx instrumentation ENABLED via HLEDAC_OTEL_PROFILE=1
    # aiohttp removed — aiohttp is now in [aiohttp-fallback] extra only
    "opentelemetry-instrumentation-aio_pika>=0.47b0",
    "opentelemetry-exporter-otlp-proto-http>=1.27.0",
    # Memory profiling (dev)
    "memray>=1.14.0",
    # CPU profiling (dev)
    "py-spy>=0.3.14",
]
# Issue 10.2: logfire for local dev observability
logfire-local = [
    "logfire>=2.0.0",
]
# F4XX: Legacy aiohttp fallback — NOT installed by default.
# Only for development/testing when explicit aiohttp is required.
# M1 8GB: saves ~25 MB RAM + 80 ms import time in default install.
aiohttp-fallback = [
    "aiohttp>=3.11.0",
]
# ── Optional ML extras ───────────────────────────────────────────────────────
# Install with: uv sync --extra ml
ml = [
    # DSPy compiled programs (HLEDAC_ENABLE_DSPY=1)
    "dspy>=3.2.1",
    # Structured generation + grammar-constrained decoding
    "outlines>=1.3.0",
    # Vision OCR (TrOCR), ANE/CoreML embedder fallbacks
    "transformers>=5.10.2",
    # Re-ranker for semantic search
    "flashrank>=0.2.10",
]
mlx-embed = [
    # MLX-native embedding (M1 unified memory, no subprocess, no conversion)
    # NOTE: exact mlx pin matches [project] main mlx pin — no version conflict.
    "mlx>=0.31.2; sys_platform == 'darwin' and platform_machine == 'arm64'",
    "mlx-embedding-models>=0.0.1; sys_platform == 'darwin' and platform_machine == 'arm64'",
]
http3 = [
    # Real QUIC lane for stealth/DA+ profiles (M1 8GB: ~50-80 MB resident).
    # INSTALL WITH: uv sync --extra http3  (NOT automatic — opt-in only)
    # CUTTING-EDGE ALTERNATIVE: neqo (Mozilla Rust QUIC) — when available, replace
    # aioquic with neqo for better M1 performance via rustls + zero-copy.
    # Currently: aioquic is the only mature Python QUIC option.
    "aioquic>=1.3.0",
    "cryptography>=48.0.0",  # BoringSSL-backed (Rust) — optimal on M1
]
m1-local = [
    # M1-specific fallbacks (no aioquic — it lives in [http3] extra for M1 8GB).
    # aioquic is ~50-80MB resident and should ONLY be installed via:
    #   uv sync --extra http3
    # This keeps the default M1 8GB footprint minimal.
]
nogil = [
    # F5.1: Free-threaded Python 3.14+ (PEP 703) support.
    # Enables true multi-core parallelism in Rust extensions WITHOUT Python GIL.
    # Impact: 7-8 M1 cores for CPU-bound work (graph traversal, simhash, etc.)
    # Requires: Python 3.14+ built with --disable-gil (Py_GIL_DISABLED=1).
    # Install with: uv sync --extra nogil
    # NOTE: PyO3 is NOT a pip package — it's a Rust crate bundled in
    # rust_extensions/Cargo.toml (compiled via maturin). This extra only
    # documents the nogil feature for type checkers / CI. The actual
    # PyO3 version is managed by rust_extensions/Cargo.toml.
]

[project.scripts]
hledac = "hledac.universal.__main__:main"
check-silent-excepts = "hledac.universal.scripts.check_silent_excepts:main"

# ── Dev tools (oddělené od runtime, uv sync --group dev) ─────────────────────
[dependency-groups]
dev = [
    # ── Testing ────────────────────────────────────────────────────────────────
    "pytest>=8.0.0",
    "pytest-asyncio>=1.4.0",
    "pytest-xdist>=3.5.0",
    "pytest-cov>=4.1.0",
    "pytest-benchmark>=4.0.0",  # Hot-path benchmarks, fail if regress >10%
    "pytest-timeout>=2.3.0",
    "hypothesis>=6.0.0,<6.50",  # Moved from [project] — test-only
    "resiliparse>=1.0.4",        # Test HTML parsing
    # ── Audit / security ────────────────────────────────────────────────────
    "pip-audit>=2.8.0",          # CVE scanning; run: uv run pip-audit
    "pip-check>=2.10.0",         # Weekly outdated-dep check; run: uv run pip-check
    # ── Dev tooling ─────────────────────────────────────────────────────────
    "pluggy>=1.0.0",
    "iniconfig>=2.0.0",
    "pygments>=2.15.0",
    "ruff>=0.1.0",
    "maturin>=1.0.0",
    "numpy>=1.24.0",
    "pyright>=1.1.410",
    "ty>=0.0.49",
    # ── Test-only extras (used in tests / probes only) ──────────────────────
    "ddgs>=9.14.4",
    "sentence-transformers>=5.5.1",
    "ijson>=3.5.0",
    "kuzu>=0.11.3; platform_machine == 'arm64'",  # M1 wheel only
    # pybloom-live REMOVED 2026-07-09: Rust MmapBloomFilter is primary (10× faster,
    # M1 NEON-SIMD xxhash, zero-copy mmap). pybloom-live was never directly imported.
    "atelier>=1.1.57",
]

# ── Setuptools namespace ──────────────────────────────────────────────────────
[tool.setuptools]
packages = ["hledac.universal"]
package-dir = { "hledac.universal" = "." }

[tool.setuptools.package-data]
"hledac.universal" = ["py.typed"]

# ── uv ────────────────────────────────────────────────────────────────────────
[tool.uv]
python-preference = "managed"
package = true

# rust_extensions workspace member — maturin build for PyO3 cdylib
# Build: uv run maturin develop --manifest-path rust_extensions/Cargo.toml --release
# CI pre-built wheels: .github/workflows/rust-extensions.yml (aarch64-apple-darwin)
["tool.uv.sources"]
"hledac-rust-extensions" = { path = "rust_extensions" }

[tool.uv.workspace]
members = ["rust_extensions"]

# ── Ruff ─────────────────────────────────────────────────────────────────────
[tool.ruff]
line-length = 120
target-version = "py314"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "B", "C4", "DTZ", "T10", "ISC", "BLE001"]
ignore = ["E501", "F821", "B027"]  # BLE001: P1-01 audit in progress — see Issue #32

[tool.ruff.lint.per-file-ignores]
# stubs/ – Apple/CoreML framework .pyi binding files; preserve original names
"stubs/**" = []
# core/rust_backend.py – FFI wrappers whose names MUST match Rust counterparts
"core/rust_backend.py" = ["N801", "N802", "N803", "N806", "N815", "N816", "BLE001"]
# brain/experimental_neuro_crypto.py – neurophysiology equations (Hodgkin-Huxley model),
# variable names like I_Na, g_K, V, m, h, n are domain-standard notation
"brain/experimental_neuro_crypto.py" = ["N803", "N806"]
# tests/transports/ – InMemoryTransport is test-only (TST001 = import-from-tests guard)
"tests/transports/**" = []
# ── P1-01: BLE001 cold-path init files ────────────────────────────────────────
# Initialization / setup / lifecycle files where fail-safe is intentional:
"runtime/__init__.py" = ["BLE001"]
"runtime/sidecar_protocol.py" = ["BLE001"]
"runtime/sidecar_protocol_adapters.py" = ["BLE001"]
"runtime/sidecar_bus.py" = ["BLE001"]
"runtime/acquisition_strategy.py" = ["BLE001"]
"runtime/sprint_entrypoint.py" = ["BLE001"]
"runtime/sprint_lifecycle.py" = ["BLE001"]
"runtime/scheduler_result.py" = ["BLE001"]
# evidence_log.py — critical hot-path (sprint findings); all fail-safe with logging
"evidence_log.py" = ["BLE001"]
"utils/__init__.py" = ["BLE001"]
"utils/exceptions.py" = ["BLE001"]
"utils/logging_config.py" = ["BLE001"]
"knowledge/__init__.py" = ["BLE001"]
"fetching/__init__.py" = ["BLE001"]
"transport/__init__.py" = ["BLE001"]
"network/__init__.py" = ["BLE001"]
"brain/__init__.py" = ["BLE001"]
"layers/__init__.py" = ["BLE001"]
"intel/__init__.py" = ["BLE001"]
"export/__init__.py" = ["BLE001"]
"stealth/__init__.py" = ["BLE001"]
"intelligence/__init__.py" = ["BLE001"]
"security/__init__.py" = ["BLE001"]
"graph/__init__.py" = ["BLE001"]
"coordinators/__init__.py" = ["BLE001"]
"scripts/__init__.py" = ["BLE001"]
# ── P1-01: archived / large monolithic files ──────────────────────────────────
# runtime/sprint_scheduler_v1_archived.py — F350M-R refactor archive (inactive)
"runtime/sprint_scheduler_v1_archived.py" = ["BLE001"]
# knowledge/duckdb_store.py — cold-path DB init/setup; hot-path uses ExceptionPolicy
"knowledge/duckdb_store.py" = ["BLE001"]
# brain/deephermes3_engine.py — cold-path MLX init/load
"brain/deephermes3_engine.py" = ["BLE001"]
# pipeline/live_public_pipeline.py — cold-path pipeline orchestration
"pipeline/live_public_pipeline.py" = ["BLE001"]
