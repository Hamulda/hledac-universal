# intelligence/archive_discovery.py — cold-path archive discovery
"intelligence/archive_discovery.py" = ["BLE001"]
# intelligence/academic_search.py — cold-path academic search
"intelligence/academic_search.py" = ["BLE001"]
# knowledge/duckdb_subprocess_writer.py — ARCHIVED (2026-07-07): DuckDBProxy dead code on M1
# Moved to: archive/duckdb_subprocess_writer_archived/
# intelligence/network_reconnaissance.py — cold-path reconnaissance
"intelligence/network_reconnaissance.py" = ["BLE001"]
# intelligence/data_leak_hunter.py — cold-path data leak hunting
"intelligence/data_leak_hunter.py" = ["BLE001"]
# knowledge/hot_edges_cache.py — cold-path hot edges cache
