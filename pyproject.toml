# ── Pytest ────────────────────────────────────────────────────────────────────
# Consolidated from pytest.ini
# ROADMAP-008: Optimized for M1 8GB with environment-aware parallelism
[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = [".", "tests"]

# TEST-01: Global timeout enforcement — prevents CI pipeline hangs on:
#   - Network timeouts (DNS, HTTP, external services)
#   - Deadlocks (import cycles, lock contention)
#   - Infinite loops (malformed test data, broken mocks)
#   - Resource exhaustion (memory/CPU thrashing)
# Default: 300s per test. Override per-test with @pytest.mark.timeout(N).
# timeout_method="thread": uses threading.Timer (works with asyncio tests).
# NOTE: Default is 300s. CLI can override via --timeout=N or HLEDAC_TEST_TIMEOUT.
timeout = 300
timeout_method = "thread"

python_files = [
    "test_*.py",
    "*_test.py",
]
python_classes = ["Test*"]
python_functions = ["test_*"]

# Suppress SwigPyObject/SwigPyPacked warnings from dspy C extension (3rd party)
filterwarnings = [
    "ignore::DeprecationWarning:swigpy",
]

