# pyproject.toml — Hledac Universal v18+
# MacBook Air M1 8GB — soukromý projekt, flat deps, žádné extras

[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "hledac-universal"
version = "18.0.0"
description = "Autonomous OSINT orchestrator for M1 MacBook — Ghost Prime"
readme = "README.md"
requires-python = ">=3.14,<3.15"
license = { text = "Proprietary" }
keywords = ["osint", "autonomous", "orchestrator", "m1", "apple-silicon"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3.14",
    "Operating System :: Apple :: macOS",
]

dependencies = [
    # ── Core async ────────────────────────────────────────────────────────────
    # aiodns REMOVED ISSUE-008: dnspython 3.x async-native covers all async DNS needs;
    # loop.getaddrinfo() fallback is always available. Manual install: uv add aiodns.
    # aiohttp REMOVED F4XX: primary transport = curl_cffi (stealth, JA3).
    # httpx handles HTTP/2 natively (h2 bundled internally).
    # Tor/I2P use httpx-socks exclusively (connection_pool_manager.py, tor/i2p_transport).
    "aiofiles>=25.1.0",
    # aioquic removed P1-3: lives in [http3] extra only (~50-80MB resident, M1 8GB opt-in).
    # uvloop 0.22+ (F3.4): Python 3.14+ M1 wheel available since June 2026.
    # uvloop gives ~2× I/O-bound speedup vs native asyncio kqueue on M1.
    "uvloop>=0.22; sys_platform == 'darwin' and platform_machine == 'arm64'",
    # ── Observability (always-on, lazy-init) ─────────────────────────────────
    # Issue #18: OTel API in main deps — always available for tracing without --extra otel.
    # Lazy init: only activates when HLEDAC_OTEL_ENABLED=1 (default 1).
    # SDK is lazy-loaded inside python_otel_bridge.py to avoid M1 8GB startup cost.
    "opentelemetry-api>=1.27.0,<2.0.0",
    "opentelemetry-sdk>=1.27.0,<2.0.0",
    # ── HTTP / stealth ────────────────────────────────────────────────────────
    # httpx<0.32.0: ISSUE-008 — relaxed upper bound to allow 0.30.x security patches.
    # 1.x is not on the roadmap. HTTP/2 stable since 0.28.x; API compatible.
    "httpx>=0.28.0,<0.32.0",
    "curl-cffi>=0.15.0,<1.0.0; sys_platform == 'darwin'",
    "brotlicffi>=1.2.0.1",
    # cloudscraper REMOVED T3: curl_cffi impersonate covers all bypass needs.
    # Supply-chain reduction: fewer deps = fewer CVEs. If bypass fails,
    # curl_cffi JA3 rotation handles Cloudflare/Akamai automatically.
    # camoufox REMOVED F330: nodriver (CDP-direct) + playwright 2-tab pool
    # (~150MB RAM cap on M1 8GB) covers all browser fingerprinting needs.
    # camoufox added redundant Firefox-specific surface area for marginal gain.
    # If explicitly needed: HLEDAC_ENABLE_CAMOUFOX=1 + install manually.
    # h2 REMOVED F3XX: httpx bundles h2 internally — no need for explicit dep.
    # HTTP/2 is enabled by default in httpx >= 0.28.0.
    # httpx-socks>=0.11.0: persistent SOCKS5 connections — one handshake, reuse across
    #   Tor circuits. httpx-socks 0.10 creates a new SOCKS5 handshake per request
    #   (50–150 ms × N requests = 5–15 s overhead at 100+ requests).
    #   API is identical — AsyncProxyTransport.from_url(rdns=) is drop-in across 0.10–0.11.x.
    "httpx-socks>=0.11.0,<0.12.0",
    # hishel>=0.0.31,<2.0.0: RFC 9111 HTTP response cache — httpx integration for
    #   browser-like caching (ETag, Last-Modified, Cache-Control). Opt-in via
    #   HLEDAC_ENABLE_HTTP_CACHE=1. AsyncSqliteStorage backend (aiosqlite dep).
    "hishel>=0.0.31,<2.0.0",
    "aiosqlite>=0.20.0",  # hishel AsyncSqliteStorage backend (RFC 9111 cache store)
    # ── Serialization ─────────────────────────────────────────────────────────
    "orjson>=3.11.0,<4.0.0",   # 3.11+ obsahuje critical perf a memory optimalizace
    # msgspec: gc=True je default az do 0.21.x (confirmed stubs). Hot-path Structs mají
    # explicit gc=False (333 upraveno v F350M-R upgrade). msgspec 0.22+ není na PyPI.
    "msgspec>=0.21.1,<0.22.0",
    # ── JSON Serialization Strategy (Issue M3) ───────────────────────────────
    # Wire format (typed structs with known schema): msgspec (msgspec.Struct)
    #   → encode/decode: msgspec.json.encode() / .decode() — 5-10× faster than stdlib json
    #   → DuckDB JSON columns: msgspec codec once at boundary, validated on the way in
    # Untyped blobs (arbitrary JSON, schemas unknown at edit time): orjson
    #   → orjson.loads() / orjson.dumps() — stdlib json replacement
    # CI gate (stdlib json ban): grep-based — catches future regressions
    #   grep -rn 'import json\|from json' --include='*.py' runtime/ knowledge/ pipeline/ fetching/
    #   Expected: 0 matches outside except-blocks. Legitimate stdlib json usage:
    #     - Inside `except ImportError` as final fallback (orjson unavailable)
    #     - `json.dump`/`json.load` for file I/O (not orjson-compatible API)
    #     - duckdb_store.py lines 116+191: orjson fallback path in _ORJSON_DECODER wrapper
    #   If match found: migrate to orjson (untyped) or msgspec (typed).
    # ruff_ext custom rule TCH909 (plugin entry point) is the automated enforcement path.
    # legacy stdlib json: 12 remaining occurrences — all inside except-blocks as fallbacks
    # F3XX: Retry modernization — replaces manual exponential-backoff retry loops
    # F3XX: Retry modernization — replaces manual exponential-backoff retry loops
    "tenacity>=9.0.0",
    # ── Storage ───────────────────────────────────────────────────────────────
    # NOTE: DuckDB maintains backward compatibility within major version (1.x).
    # Python duckdb 1.5.x is backward-compatible with DuckDB 1.10.x files.
    # rust_extensions bundles DuckDB 1.10.5 C++ source; no ABI conflict exists.
    # UPGRADE 2026-07-05: Extended upper bound to <2.0.0 for DuckDB 1.10+ support.
    "duckdb>=1.5.4,<2.0.0",
    # Issue 4.3: sqlite-vec primary ANN store — zero-process, M1-native, ~5MB vs ~200MB LanceDB subprocess.
    # LanceDB moved to [ml] extra (opt-in, >1M vectors where Rust-side ANN gives real benefit).
    "sqlite-vec>=0.1.0",
    "pyarrow>=24.0.0,<25.0.0",
    "lmdb>=2.2.0",
    # ── MLX / Apple Silicon ───────────────────────────────────────────────────
    # NOTE: mlx + mlx-lm exact pins come from uv.lock; >= here allows range resolution.
    # MLX_ENABLE_MLX=1 gate in runtime.
    "mlx>=0.31.2; sys_platform == 'darwin' and platform_machine == 'arm64'",
    "mlx-lm>=0.31.3; sys_platform == 'darwin' and platform_machine == 'arm64'",
    # Issue #50: mlx-lm 0.31.x METADATA incorrectly specifies transformers>=5.0.0.
    # Actual runtime: works with both 4.x and 5.x (tested with 5.13.0).
    # transformers UNIFIED: main dep removed (was duplicate); [ml] extra holds the
    # canonical pin (>=5.10.2 for DSPy compatibility). mlx-lm works without it.
    # If you need transformers without [ml]: pip install transformers (no version pin needed).
    "mlx-embeddings>=0.1.0; sys_platform == 'darwin' and platform_machine == 'arm64'",
    # ── NER / NLP ─────────────────────────────────────────────────────────────
    "gliner2>=1.0.1",
    "mlx-gliner2>=0.1.1; sys_platform == 'darwin' and platform_machine == 'arm64'",
    "fast-langdetect>=1.0.1",
    # ── Numerika / ML (light) ─────────────────────────────────────────────────
    # MIGRATED to [ml] extra: scipy, scikit-learn, xgboost, lightgbm.
    # M1 8GB: 0 usage in codebase; hundreds of MB disk + RAM pressure avoided.
    "numpy>=2.5.0,<3.0.0",  # M1 8GB: cap at <3.0.0 for ABI stability
    # xgrammar, onnxscript: required by mlx-lm / transformers integration
    "xgrammar>=0.2.1",
    "onnxscript>=0.7.0",
    # ── Vektorové indexy ──────────────────────────────────────────────────────
    # fastembed REMOVED P0-1: MLXEmbeddingManager is primary for M1; fastembed was fallback only
    # hnswlib REMOVED P1-9: usearch is primary (M1 Metal SIMD, smaller footprint)
    "usearch>=2.25.3",
    "datasketch>=1.10.0",
    "python-dotenv>=1.0.0",
    "rank-bm25>=0.2.2",
    # UPGRADE 2026-07-05: Extended upper bound to <0.20.0 for rustworkx 0.18+ support.
    "rustworkx>=0.17.1,<0.20.0",
    # python-igraph REMOVED P2-5d: rustworkx is primary graph library (2026-07-17)
    # rustworkx PyGraph replaced igraph.Graph for M1-optimized in-memory graphs
    "rapidfuzz>=3.0.0",
    # ── Parsing / web scraping ────────────────────────────────────────────────
    # selectolax PRIMARY: fast, pure Python, CSS selectors (M1 8GB friendly).
    # lxml FALLBACK: only for complex XPath queries (selectolax cannot do //a/@href).
    # nh3 (F4): Rust HTML sanitizer, 9× faster than BS4, 4 MB RSS, M1-safe.
    "nh3>=0.2.21",
    "selectolax>=0.4.10",
    "lxml>=6.1.1",
    "markdownify",
    # ── Dokumenty / OCR ───────────────────────────────────────────────────────
    "pymupdf>=1.27.2.3",
    "pypdf>=5.0.0",  # pypdf2 merged into pypdf (v5+); pypdf2 is deprecated
    "python-docx",
    "pillow>=12.2.0",
    "ocrmac>=1.0.1; sys_platform == 'darwin'",
    "pytesseract>=0.3.10",
    # ── Reporting / templating (Issue 12.1)
    "jinja2>=3.1.0",
    "markdown-it-py>=3.0.0",
    # ── Apple frameworks (PyObjC) ─────────────────────────────────────────────
    # MOD-12: Central lazy import via core/frameworks (PEP 810) — lazy, never at startup.
    # All deps already have sys_platform == 'darwin' marker.
    "pyobjc-framework-cocoa>=12.2; sys_platform == 'darwin'",
    "pyobjc-framework-vision>=12.2; sys_platform == 'darwin'",
    "pyobjc-framework-quartz>=12.2; sys_platform == 'darwin'",
    "pyobjc-framework-naturallanguage>=12.2; sys_platform == 'darwin'",
    "pyobjc-framework-coreml>=12.2; sys_platform == 'darwin'",
    "pyobjc-framework-WebKit>=12.2; sys_platform == 'darwin'",
    # Python 3.14: both 8.x and 9.x lack wheels; upper bound needed for ANE ops (macOS SDK 15+)
    "coremltools>=8.0,<10.0",
    # ── Kryptografie ──────────────────────────────────────────────────────────
    "cryptography>=48.0.0",
    "pyzipper>=0.3.6",
    "stem>=1.8.0",
    # ── Hashing / dedup / Bloom ───────────────────────────────────────────────
    "pyprobables>=0.7.0",
    # xxhash 3.x is stable. 4.x has breaking API changes (module restructure).
    # IMPORTANT: Use xxhash.xxh3_64() (xxHash3-64, SIMD) — compatible with Rust xxh3_64.
    # Exceptions (xxh64 acceptable):
    #   - Bloom filter: uses seeded xxh64 for double-hashing technique (bloom_filter.py)
    #   - IOC internal IDs: own namespace, not cross-language (duckdb_store, ioc_graph, ioc_extract)
    "xxhash>=3.7.0,<4.0.0",
    "mmh3>=5.2.1",
    # ── Networking / OSINT ────────────────────────────────────────────────────
    "dnspython>=2.4.0,<3.0.0",  # ISSUE-008: 2.7 EOL; 3.x is stable async-native (2026)
    "ipwhois>=1.3.0",
    "yara-python>=4.5.4",
    "stix2>=3.0.1",
    "scapy>=2.5.0",
    "pyvis>=0.3.2",
    # ── Pattern matching ──────────────────────────────────────────────────────
    "pyahocorasick>=2.3.1",
    "ahocorasick-rs>=1.0.3",
    # ── IPC / shared memory (M1 zero-copy cross-process) ─────────────────────
    'posix-ipc>=1.1.1; sys_platform == "darwin"',
    # ── Komprese ──────────────────────────────────────────────────────────────
    "zstandard>=0.25.0",  # zstd bindings — zstd removed (duplicate, zstandard is primary)
    "lz4",
    # ── Modely / datové struktury ─────────────────────────────────────────────
    # Issue #49: upper bound prevents accidental upgrade to v3 (ABI break).
    # Audit [ml] extra: transformers>=5.10.2 (5.x), dspy>=3.2.1, outlines>=1.3.0,
    # flashrank>=0.2.10 — none require pydantic; uv.lock confirms pydantic 2.x only.
    "pydantic>=2.10.0,<3.0.0",
    # B1: LRUCache for bounded vulnerability_cache (CVE hot-path, M1 8GB safe)
    "cachetools>=7.1.4",
    "pyyaml>=6.0",
    "defusedxml",
    "diff-match-patch",
    "piexif",
    "PyWavelets>=1.7.0",
    "setproctitle",
    "zeroconf",
    "python-multipart>=0.0.32",
    # ── Monitorování / debug ──────────────────────────────────────────────────
    "psutil>=5.9.0",
    "debugpy>=1.8.21",
    "pydantic-settings>=2.14.2",
    "structlog>=24.4.0",
    "cyclopts>=4.22.2",
    "diskcache>=5.6.3",
]

[project.optional-dependencies]
# P0-3: OpenTelemetry instrumentation (Sprint T1).
# Manual spans via otel.span() — M1 8GB safe. httpx auto-instr via
# HLEDAC_OTEL_PROFILE=1. Default exporter: JSON-Lines to stdout.
# Install with: uv sync --extra otel
otel = [
    # Issue #18: opentelemetry-api + sdk moved to main deps (always-on tracing).
    # Keep instrumentation + exporters in extra.
    "opentelemetry-instrumentation-httpx>=0.47b0",
    "opentelemetry-exporter-otlp-proto-http>=1.27.0",
    "opentelemetry-instrumentation-aio-pika[observability]>=0.47b0",
    "opentelemetry-instrumentation-asyncpg[observability]>=0.47b0",
    "logfire[observability]>=2.0.0",
    "structlog>=24.0.0,<25.0.0",
    # cachetools promoted to core deps (B1 fix: LRUCache for vulnerability_cache)
    "roampal>=0.5.7",
]
# Issue 10: observability extras — OTLP + profiling
observability = [
    # Memory profiling (dev)
    "memray>=1.14.0",
    # CPU profiling (dev)
    "py-spy>=0.3.14",
]
# ── Optional ML extras ───────────────────────────────────────────────────────
# Install with: uv sync --extra ml
ml = [
    # Issue M4: Classical ML — moved from main deps to [ml] extra.
    # M1 8GB: 0 usage in codebase; saves ~500 MB disk + RAM pressure.
    # xgboost, lightgbm, scipy, scikit-learn: NO runtime imports anywhere.
    # transformers pin (>=5.10.2) unifies main deps duplicate (was >=4.30).
    "scipy>=1.17.1",
    "scikit-learn>=1.9.0",
    "xgboost>=3.2.0",
    "lightgbm>=4.6.0",
    # LanceDB ANN — opt-in for >1M vectors where Rust-side HNSW gives real benefit.
    # Default: sqlite-vec primary (zero-process, M1-native, ~5MB resident).
    # Install with: uv sync --extra ml  (also installs DSPy, transformers, flashrank).
    "lancedb>=0.34.0,<0.36.0",
    # sentence-transformers: lazy-imported via mlx-gliner2 in brain/ane_embedder.py.
    # NOT in main deps/dev — mlx-gliner2 pulls it as a soft dep at inference time.
    "sentence-transformers>=5.5.1",
    # DSPy compiled programs (HLEDAC_ENABLE_DSPY=1)
    "dspy>=3.2.1",
    # Structured generation + grammar-constrained decoding
    "outlines>=1.3.0",
    # Vision OCR (TrOCR), ANE/CoreML embedder fallbacks
    "transformers>=5.10.2",
    # Re-ranker for semantic search
    "flashrank>=0.2.10",
]
# diskcache>=5.6.0: safetensors/model weights cache ONLY (LanceDB, embedding downloads).
# NOT for URL caching — hishel (main deps) handles RFC 9111 HTTP response cache.
# Namespace separation: diskcache "safetensors" namespace vs hishel "http" namespace.
ml-diskcache = [
    "diskcache>=5.6.0",  # safetensors/embedding weights cache (LanceDB, model downloads)
]
# ── mlx-lm Architecture Note (F4XX) ─────────────────────────────────────────
# WARNING: mlx-lm Python package (installed via [ml] extra above) is intended
# ONLY for development and as a FALLBACK when the external Rust mlxcel binary
# is not available.
#
# PRODUCTION INFERENCE ARCHITECTURE (M1 8GB / 16+ threads):
#   The canonical inference path uses `mlxcel` — a standalone Rust binary that
#   runs OUTSIDE the Python process via UNIX domain socket
#   (/tmp/hledac_mlxcel.sock) or subprocess pipes.
#
#   Benefits of mlxcel over in-process mlx-lm:
#     - RSS savings: ~300MB (Python mlx-lm bindings + MLX Metal runtime NOT
#       loaded in Python process — mlxcel runs as separate Rust process)
#     - M1 8GB ceiling: Python orchestrator (~1GB) + mlxcel (~2GB subprocess)
#       leaves ~5GB for OS + KV cache vs ~6.25GB all-in-process
#     - Failure isolation: mlxcel crash ≠ Python crash
#     - Metal context: Rust has direct GPU queue access without Python GIL
#
#   Installation of mlxcel (outside pip/uv):
#     # Build from source or download release from GitHub releases
#     cargo install mlxcel  # or download prebuilt binary
#     # mlxcel is auto-detected at runtime via:
#     #   ~/.local/bin/mlxcel, ~/bin/mlxcel, /usr/local/bin/mlxcel,
#     #   /opt/homebrew/bin/mlxcel, $PATH/mlxcel
#
#   When mlxcel IS available: Brain/model_manager.py routes ALL Hermes inference
#   through MlxcelIpcClient → mlxcel (DeepHermes3Engine stays unloaded).
#
#   When mlxcel is NOT available: Falls back to DeepHermes3Engine (in-process
#   mlx-lm Python bindings) — development / CI / no-Rust environments only.
#
# VERSION COLLISION CHECK (transformers vs dspy):
#   dspy>=3.2.1 typically requires transformers>=4.30.0
#   This [ml] extra pins transformers>=5.10.2 (compatible with both dspy and
#   flashrank). No known collision at these version ranges.
#   If you encounter ImportError: cannot import name 'Signal' from 'transformers':
#     - Downgrade dspy to ~2.5.x which is compatible with transformers 4.x
#     - Or upgrade transformers to >=4.30.0

mlx-embed = [
    # MLX-native embedding (M1 unified memory, no subprocess, no conversion)
    # NOTE: exact mlx pin matches [project] main mlx pin — no version conflict.
    "mlx>=0.31.2; sys_platform == 'darwin' and platform_machine == 'arm64'",
    "mlx-embedding-models>=0.0.1; sys_platform == 'darwin' and platform_machine == 'arm64'",
]
http3 = [
    # Real QUIC lane for stealth/DA+ profiles (M1 8GB: ~50-80 MB resident).
    # INSTALL WITH: uv sync --extra http3  (NOT automatic — opt-in only)
    # F320 hybrid strategy — auto-detection via get_quic_transport_adapter():
    #   arm64 darwin + neqo available  → NeqoRustlsTransportAdapter (rustls,
    #     immediate arena release, keeps M1 8GB UMA clean between requests)
    #   otherwise                     → AioquicTransportAdapter (fallback)
    # ARCHITECTURAL NOTE (M1 8GB): neqo + rustls has lower RAM footprint
    # than aioquic + cryptography/BoringSSL because rustls uses M1-native
    # ciphers and immediately releases memory arenas on session close.
    # neqo is detected at RUNTIME via _probe_neqo() (arm64 darwin only),
    # so the package is listed here for future expansion but is NOT
    # currently on PyPI (TODO: add PyO3/ne-qp-rs wrapper when neqo ships
    # a Python wheel; currently aioquic is the only available QUIC engine).
    # "neqo>=0.1.0",  # ← UNCOMMENT WHEN neqo ships a PyPI wheel
    # aioquic is the fallback when neqo is unavailable (x86_64, Linux, CI).
    # M1 8GB RAM: aioquic is ~50-80 MB resident due to OpenSSL/BoringSSL
    # and is therefore deprecated on M1 arm64 in favour of neqo.
    "aioquic>=1.3.0",
    "cryptography>=48.0.0",  # BoringSSL-backed (Rust) — used by aioquic fallback
]
m1-local = [
    # M1-specific fallbacks (no aioquic — it lives in [http3] extra for M1 8GB).
    # aioquic is ~50-80MB resident and should ONLY be installed via:
    #   uv sync --extra http3
    # This keeps the default M1 8GB footprint minimal.
]
# ISSUE-FIX: graph-storage extra was referenced in check_dependency_profiles.py but never existed.
# This extra provides the columnar analytics stack: duckdb + lancedb + pyarrow + polars.
# duckdb a pyarrow jsou v main deps — sem pro konzistenci dependency manifestu.
# Install with: uv sync --extra graph-storage
graph-storage = [
    # duckdb a pyarrow jsou v main deps — sem pro konzistenci dependency manifestu.
    # lancedb ŽIVÁ V [ml] extra (ne zde) — graph-storage NENÍ pro ANN!
    "pyarrow>=24.0.0,<25.0.0",
    # Polars 1.43+: improved streaming engine for M1 8GB, streaming collect by default.
    # NENÍ v main deps — pouze v graph-storage extra.
    "polars>=1.43.0,<2.0.0",
]
[project.scripts]
hledac = "hledac.universal.__main__:main"
check-silent-excepts = "hledac.universal.scripts.check_silent_excepts:main"

# ── Dev tools (oddělené od runtime, uv sync --group dev) ─────────────────────
[dependency-groups]
dev = [
    # ── Testing ────────────────────────────────────────────────────────────────
    "pytest>=8.0.0",
    "pytest-asyncio>=1.4.0",
    "pytest-mock>=3.14.0",  # Issue #10: mocker fixture for MagicMock/AsyncMock lifecycle (~30-50 MB session savings)
    "pytest-xdist>=3.5.0",
    "pytest-cov>=4.1.0",
    "pytest-benchmark>=4.0.0",  # Hot-path benchmarks, fail if regress >10%
    "pytest-timeout>=2.3.0",
    "hypothesis>=6.0.0,<6.50",  # Moved from [project] — test-only
    "resiliparse>=1.0.4",        # Test HTML parsing
    # ── Audit / security ────────────────────────────────────────────────────
    "pip-audit>=2.8.0",          # CVE scanning; run: uv run pip-audit
    "pip-check>=2.10.0",         # Weekly outdated-dep check; run: uv run pip-check
    # ── Dev tooling ─────────────────────────────────────────────────────────
    "pluggy>=1.0.0",
    "iniconfig>=2.0.0",
    "pygments>=2.15.0",
    "ruff>=0.1.0",
    "maturin>=1.0.0",
    "numpy>=2.5.0,<3.0.0",  # M1 8GB: cap at <3.0.0 for ABI stability
    "pyright>=1.1.410",
    "ty>=0.0.49",
    # ── Test-only extras (used in tests / probes only) ──────────────────────
    "ddgs>=9.14.4",          # DuckDuckGo SERP — runtime dep in discovery/duckduckgo_adapter.py
    # sentence-transformers REMOVED from dev: lazy-imported via mlx-gliner2/modernbert
    # in brain/ane_embedder.py; NOT a runtime dep for standard ML pipeline.
    # If needed: pip install sentence-transformers (not in uv lock, not installed by default).
    "ijson>=3.5.0",
    "kuzu>=0.11.3; platform_machine == 'arm64'",  # M1 wheel only
    # pybloom-live REMOVED 2026-07-09: Rust MmapBloomFilter is primary (10× faster,
    # M1 NEON-SIMD xxhash, zero-copy mmap). pybloom-live was never directly imported.
]

# ── Setuptools namespace ──────────────────────────────────────────────────────
[tool.setuptools]
packages = ["hledac.universal"]
package-dir = { "hledac.universal" = "." }

[tool.setuptools.package-data]
"hledac.universal" = ["py.typed"]

# ── uv ────────────────────────────────────────────────────────────────────────
[tool.uv]
python-preference = "managed"
package = true

# rust_extensions workspace member — maturin build for PyO3 cdylib
# Build: uv run maturin develop --manifest-path rust_extensions/Cargo.toml --release
# CI pre-built wheels: .github/workflows/rust-extensions.yml (aarch64-apple-darwin)
["tool.uv.sources"]
"hledac-rust-extensions" = { path = "rust_extensions" }

[tool.uv.workspace]
members = ["rust_extensions"]

# NOTE: Python 3.14 JIT (PYTHON_JIT=1) is configured in .env, not in pyproject.toml.
# uv does not support [tool.uv.env] in all versions. See .env.example.

# ── Ruff ─────────────────────────────────────────────────────────────────────
[tool.ruff]
line-length = 120
target-version = "py314"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "B", "C4", "DTZ", "T10", "ISC", "BLE001", "YTT", "ANN", "PIE790", "C901", "F811"]  # I002: dual-namespace guard; YTT/ANN/PIE790/C901: code quality; F811: redefinition (C-1 double-def guard)
ignore = ["E501", "F821", "B027"]  # BLE001: P1-01 audit in progress — see Issue #32
# E911: P1-1 custom — forbid asyncio.run() outside allowed entry points.
# Allowed: __main__, tools/, tests/. Use: grep -rn 'asyncio\.run(' ... | grep -v __main__ | grep -v 'tools/' | grep -v 'tests/'
# CI: run `grep -rn 'asyncio\.run(' runtime intelligence brain knowledge prefetch cli layers transport network export report rendering coordinators/ 2>/dev/null | grep -v __main__ | grep -v tools/ | grep -v tests/` — expect 0 matches.
# F911: asyncio.wait_for ban — use safe_wait_for() from utils.async_helpers instead.
# EXCEPTION: asyncio.wait_for(asyncio.shield(...)) patterns MUST keep asyncio.wait_for
# (shield requires wait_for's timeout-interrupt behavior; safe_wait_for uses asyncio.timeout
# which doesn't guarantee shield protection). Each shield site has inline noqa: F911.
# TPL001: threading.Lock() must be registered in core/locks.py LockCategory registry.
# CI: grep -rn 'threading\.Lock()' --include='*.py' . \
#   | grep -v '.venv' | grep -v 'test' | grep -v 'probe' \
#   | grep -v 'register_lock\|core/locks' \
#   | grep -v '# noqa' \
#   | grep -v 'self\._lock\|cls\._lock\|_thread_lock\|_factory_lock\|_init_lock\|_lock_factory\|\.lock = threading' \
#   | grep -v '# .*threading\.Lock()' — expect 0 matches for unregistered GLOBAL module-level locks.
# Per-instance locks (self._lock), class locks (cls._lock), and DCLP pattern locks
# (_*_lock for async Lock init) are exempt — see core/locks.py NOTE: "registrace se
# DOPORUČUJE pro audit, ale není kritická. Kritická je pouze pro global/module-level locks."
# All GLOBAL threading.Lock / threading.RLock instances must call
# register_lock(LockCategory.XXX, lock, "module._name"). See core/locks.py.
# ── Issue P3: ASYNC461 ban raw asyncio.gather without return_exceptions=True ───────
# Ban raw `asyncio.gather(...)` call sites that bypass fail-soft invariants.
# Allowed patterns:
#   - asyncio.gather(..., return_exceptions=True)
#   - parallel(*coros, policy=...) (any policy)
#   - parallel_ok(*coros), safe_gather_*(...)
#   - _asyncio.gather(...) (internal alias)
# CI gate: `python tools/audit/ban_raw_gather.py` — expects 0 violations.
# Tests/ are skipped (raw gather is legitimate for concurrent-test fixtures).

[tool.ruff.lint.per-file-ignores]
# stubs/ – Apple/CoreML framework .pyi binding files; preserve original names
"stubs/**" = []
# core/rust_backend.py – FFI wrappers whose names MUST match Rust counterparts
# BLE001 removed: all bare exceptions now have inline noqa comments
"core/rust_backend.py" = ["N801", "N802", "N803", "N806", "N815", "N816"]
# brain/experimental_neuro_crypto.py – neurophysiology equations (Hodgkin-Huxley model),
# variable names like I_Na, g_K, V, m, h, n are domain-standard notation
"brain/experimental_neuro_crypto.py" = ["N803", "N806"]
# tests/transports/ – InMemoryTransport is test-only (TST001 = import-from-tests guard)
"tests/transports/**" = []
# ── Issue A1: Dual import namespace — RUFF022 ban bare package imports ───────────
# Canonical form: always hledac.universal.<pkg> (src-layout convention).
# Bare imports (from runtime, from brain, from knowledge, from core, from
# coordinators) work via the flat-layout hacks in __init__.py / _namespace_bootstrap
# but create dual-load risk, circular-dep traps, and tooling blind-spots.
# Ruff has no built-in "ban this import path" rule, so we enforce via:
#   1. I002 isort: groups bare pkg imports separately from hledac.universal ones
#      → dual-namespace files fail I002 (unsorted import groups)
#   2. F401 (unused-import): after the codemod, bare imports become unused stumps
#      → CI catches regressions automatically
#   3. RUFF022 custom plugin: banned-imports rule in ruff_ext/__init__.py
#      → requires ruff_ext to be installed; CI gate is the ruff_ext check or skip
# CI gate: `ruff check . --extend-select RUFF022` (RUFF022 = banned-imports)
#   Run: uv run ruff check . --no-cache 2>&1 | grep RUFF022 || true
# Codemod: scripts/codemod_dual_namespace.py (one-shot, reversible via git)

# I002 = isort required-import order; dual-namespace files MIX two groups → caught
# UP035 = deprecated imports; I005 = missing import for isort
# C901 = complex comprehension; PIE790 = unnecessary pass
# YTT = type conversion; ANN = annotation completeness
# These files have legitimate fail-safe cold-path patterns (init, cleanup, shutdown)
# where catching Exception with proper handling is intentional.
"graph/quantum_pathfinder.py" = ["BLE001"]  # cold-path graph query orchestration
