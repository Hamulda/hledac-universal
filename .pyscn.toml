# pyscn.toml - Architecture rules for Hledac Universal
# PySCN v1.29.0+ layer-based architecture enforcement

# =============================================================================
# ARCHITECTURE VALIDATION
# =============================================================================

[architecture]
enabled = true
validate_layers = true
strict_mode = true

# Layer definitions: name + package prefix patterns that belong to the layer
# Module "knowledge.foo.bar" matches first layer whose packages[] contains a prefix.
# Order matters: first match wins. Use most specific prefixes first.

[[architecture.layers]]
name = "infrastructure"
packages = [
    "knowledge.db",
    "knowledge.atomic_storage",
    "knowledge.lmdb_subdb",
    "knowledge.lmdb_boot_guard",
    "knowledge.assertions",
]

[[architecture.layers]]
name = "cache"
packages = [
    "knowledge._query_cache",
]

[[architecture.layers]]
name = "wal"
packages = [
    "knowledge.wal",
    "knowledge.duckdb_wal_manager",
]

[[architecture.layers]]
name = "quality"
