# Layer dependency rules (from lower to higher)
# Priority: higher index = "higher" layer. Violation when high depends on low.
# Order: infrastructure < cache < wal < quality < dedup < storage < graph < sprint < analytics < memory < protocols < crosscutting

[[architecture.rules]]
from = "infrastructure"
allow = ["infrastructure"]

[[architecture.rules]]
from = "cache"
allow = ["infrastructure", "cache"]

[[architecture.rules]]
from = "wal"
allow = ["infrastructure", "cache", "wal"]

[[architecture.rules]]
from = "quality"
allow = ["infrastructure", "cache", "wal", "quality"]

[[architecture.rules]]
from = "dedup"
allow = ["infrastructure", "cache", "wal", "quality", "dedup"]

[[architecture.rules]]
from = "storage"
# storage is the central orchestrator — intentionally depends on foundational layers + sprint + crosscutting
allow = ["infrastructure", "cache", "wal", "quality", "dedup", "storage", "sprint", "crosscutting"]

[[architecture.rules]]
from = "graph"
allow = ["infrastructure", "cache", "wal", "quality", "dedup", "storage", "graph"]

[[architecture.rules]]
from = "sprint"
allow = ["infrastructure", "cache", "wal", "quality", "dedup", "storage", "sprint"]

[[architecture.rules]]
from = "analytics"
allow = ["infrastructure", "cache", "wal", "quality", "dedup", "storage", "sprint", "analytics"]

[[architecture.rules]]
from = "memory"
allow = ["infrastructure", "cache", "wal", "quality", "dedup", "storage", "memory"]

[[architecture.rules]]
from = "protocols"
allow = ["infrastructure", "cache", "wal", "quality", "dedup", "storage", "protocols"]

[[architecture.rules]]
from = "crosscutting"
allow = ["infrastructure", "cache", "wal", "quality", "dedup", "storage", "crosscutting"]

[[architecture.rules]]
from = "root"
allow = ["infrastructure", "cache", "wal", "quality", "dedup", "storage", "graph", "sprint", "analytics", "memory", "protocols", "crosscutting", "root"]

[[architecture.rules]]
from = "brain"
allow = ["infrastructure", "cache", "wal", "quality", "dedup", "storage", "transport", "brain"]

[[architecture.rules]]
from = "coordinators"
allow = ["infrastructure", "cache", "wal", "quality", "dedup", "storage", "graph", "sprint", "analytics", "memory", "protocols", "crosscutting", "root", "brain", "transport", "coordinators"]

[[architecture.rules]]
from = "transport"
allow = ["infrastructure", "cache", "wal", "quality", "dedup", "transport"]

[[architecture.rules]]
from = "pipeline"
allow = ["infrastructure", "cache", "wal", "quality", "dedup", "storage", "graph", "sprint", "analytics", "memory", "protocols", "crosscutting", "root", "brain", "transport", "coordinators", "pipeline"]

# =============================================================================
# SINGLE RESPONSIBILITY (SRP)
# =============================================================================

[srp]
# Note: "responsibilities" in pyscn = fan-out (how many different modules this module imports/depends on)
# This is NOT fan-in. Central orchestrators like duckdb_store naturally depend on many subsystems.
# For knowledge layer: duckdb_store is a facade that orchestrates 12 subsystems - this is intentional.
max_responsibilities = 15

# KNOWN FALSE POSITIVES (documented — do not require fixes):
# - knowledge._quality_types (warning): 1 tiny msgspec struct, imported by 4 modules = intentional API boundary
# - knowledge.duckdb_store (error): Central orchestrator/facade, depends on 12 subsystems = intentional design
#   Splitting duckdb_store would be 6+ months of risky work for marginal benefit on M1 8GB.
# - coordinators.base (error): Base coordinator facade, re-exports types from 5 transport submodules via TYPE_CHECKING.
#   Fan-in 11 = 11 concrete coordinators importing it. Inherent aggregator pattern, not a design flaw.
# - transport.base (error): Transport protocol facade per [TP-1] invariant. Re-exports from 5 submodules for single import point.
#   Fan-out 5 = 5 re-exported concerns. Removing re-exports would break [TP-1] and scatter imports.
# - transport.curl_cffi_fetch (error): Fetch function that fans into 4 concerns (retry, error-handling, TLS config, UA).
#   Not a class — function-level SRP doesn't apply the same way. Inline extraction would hurt readability.
# - transport.tor_transport (warning): Transport aggregator, fans into 3 concerns (Tor, tunnel, DNS). Low severity.

# =============================================================================
# CLONE DETECTION
# =============================================================================

[clones]
enabled = true
min_lines = 5
similarity_threshold = 0.8

# =============================================================================
# CBO (COUPLING)
# =============================================================================

[cbo]
enabled = true
low_threshold = 3
medium_threshold = 7
max_cbo_warning = 15
