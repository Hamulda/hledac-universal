<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Getting Started</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <div class="page-wrapper">
  <div class="container">
    <!-- Header -->
    <header class="header">
      <div class="header-top">
        <div class="logo">
          <svg viewBox="0 0 572 575" fill="currentColor" class="logo-icon">
            <path d="M432.513 296.075C507.478 296.075 568.6 355.206 571.642 429.29H572V575H293.031V429.29H293.389C296.431 355.206 357.549 296.076 432.513 296.075ZM278.969 393.927C278.969 493.679 197.958 574.544 98.0277 574.545H0V296.075H278.969V393.927ZM278.969 145.71H278.611C275.569 219.794 214.451 278.924 139.487 278.925C64.5217 278.925 3.3997 219.794 0.35751 145.71H0V0H278.969V145.71ZM572 278.925H293.031V181.073C293.031 81.3208 374.042 0.455893 473.972 0.455317H572V278.925Z" />
          </svg>
        </div>
        <div>
          <h1>Getting Started</h1>
          <p class="subtitle">Try these steps to explore what Projekt can do.</p>
        </div>
      </div>
    </header>

    <!-- Bento Grid -->
    <section class="section">
      <ul class="bento-grid">
        <!-- Card 1: Ask the agent (wide) -->

            <input type="checkbox" class="check-input" />
            <div class="bento-glow bento-glow--green"></div>
            <div class="bento-visual">
              <div class="sessions-panel sessions-panel--wide">
                <div class="sessions-tabs">
                  <div class="session-tab session-tab--active">

"/>
                    </svg>
                    <span>Claude Code</span>
                  </div>
                </div>
                <div class="sessions-body">
                  <div class="terminal-line terminal-line--path">~/projekt-demo</div>
                  <div class="terminal-line">
                    <span class="terminal-prompt">&gt;</span>
                    <span class="terminal-cmd">Tell me about this project</span>
                  </div>
                </div>
              </div>
            </div>
            <div class="bento-text">
              <span class="check-box"></span>
              <div>
                <h3 class="bento-title">Ask the agent something</h3>
                <p class="bento-desc">Type a message in the terminal and press <code>Enter</code></p>
              </div>
            </div>
          </label>
        </li>

        <!-- Card 2: Open another session -->
        <li class="bento-card">
          <label class="bento-inner">
            <input type="checkbox" class="check-input" />
            <div class="bento-glow bento-glow--blue"></div>
            <div class="bento-visual">
              <div class="sessions-panel">
                <div class="sessions-tabs">
                  <div class="session-tab session-tab--active">
                    <svg class="session-icon" viewBox="0 6 24 30" fill="currentColor" width="11" height="11"><path d="M18 30H6V18H18V30Z" opacity="0.4"/><path d="M18 12H6V30H18V12ZM24 36H0V6H24V36Z"/></svg>
                    <span>OpenCode</span>
                  </div>

"/>
                    </svg>
                    <span>Claude Code</span>
                  </div>
                  <div class="session-add">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" width="11" height="11"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>
                  </div>
                </div>
                <div class="sessions-body">
                  <div class="terminal-line">
                    <span class="terminal-prompt">&gt;</span>
                    <span class="terminal-cursor terminal-cursor--dim"></span>
                  </div>
                </div>
              </div>
            </div>
            <div class="bento-text">
              <span class="check-box"></span>
              <div>
                <h3 class="bento-title">Open another session</h3>
                <p class="bento-desc">Run multiple agents side by side</p>
              </div>
            </div>
          </label>
        </li>

        <!-- Card 3: Select and edit -->
        <li class="bento-card bento-half">
          <label class="bento-inner">
            <input type="checkbox" class="check-input" />
            <div class="bento-glow bento-glow--cyan"></div>
            <div class="bento-visual">
              <div class="select-mock">
                <div class="select-element">
                  <div class="select-outline">
                    <span>Page Title</span>
                  </div>
                </div>
                <svg class="select-cursor" viewBox="0 0 24 24" fill="currentColor" width="24" height="24"><path d="M3 3l7.07 16.97 2.51-7.39 7.39-2.51L3 3z"/></svg>
              </div>
            </div>
            <div class="bento-text">
              <span class="check-box"></span>
              <div>
                <h3 class="bento-title">Select and edit an element</h3>
                <p class="bento-desc">Click an element, then describe changes in the terminal</p>
              </div>
            </div>
          </label>
        </li>

        <!-- Card 4: Try mobile view (wide) -->
        <li class="bento-card bento-half">
          <label class="bento-inner">
            <input type="checkbox" class="check-input" />
            <div class="bento-glow bento-glow--purple"></div>
            <div class="bento-visual">
              <div class="viewport-toolbar viewport-toolbar--horizontal">
                <span class="vp-btn">
                  <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" width="30" height="30"><rect x="2" y="3" width="20" height="14" rx="2"/><line x1="8" y1="21" x2="16" y2="21"/><line x1="12" y1="17" x2="12" y2="21"/></svg>
                </span>
                <span class="vp-btn">
                  <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" width="30" height="30"><rect x="4" y="2" width="16" height="20" rx="2"/><line x1="12" y1="18" x2="12.01" y2="18"/></svg>
                </span>
                <span class="vp-btn vp-btn--active">
                  <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" width="30" height="30"><rect x="5" y="2" width="14" height="20" rx="2"/><line x1="12" y1="18" x2="12.01" y2="18"/></svg>
                </span>
              </div>
            </div>
            <div class="bento-text">
              <span class="check-box"></span>
              <div>
                <h3 class="bento-title">Try mobile view</h3>
                <p class="bento-desc">Switch viewports in the preview toolbar</p>
              </div>
            </div>
          </label>
        </li>

        <!-- Card 5: Command palette -->
        <li class="bento-card bento-large">
          <label class="bento-inner bento-inner--row">
            <input type="checkbox" class="check-input" />
            <div class="bento-glow bento-glow--white"></div>
            <div class="bento-text bento-text--inline">
              <span class="check-box"></span>
              <div>
                <h3 class="bento-title">Open command palette</h3>
                <p class="bento-desc">Access quick actions and slash commands</p>
              </div>
            </div>
            <div class="bento-visual bento-visual--compact">
              <div class="palette-mock">
                <div class="palette-keys">
                  <kbd class="key-cap">&#8984;</kbd>
                  <kbd class="key-cap key-cap--press">K</kbd>
                </div>
              </div>
            </div>
          </label>
        </li>

        <!-- Card 6: OpenCode -->
        <li class="bento-card bento-third">
          <div class="bento-inner bento-inner--logo">
            <svg viewBox="0 6 24 30" fill="currentColor" class="logo-card-icon"><path d="M18 30H6V18H18V30Z" opacity="0.4"/><path d="M18 12H6V30H18V12ZM24 36H0V6H24V36Z"/></svg>
          </div>
        </li>

        <!-- Card 7: Claude -->

          <div class="bento-inner bento-inner--logo">

  </div>
  </div>

  <script src="script.js"></script>
</body>
