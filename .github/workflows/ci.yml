name: CI

# Phase 9: Quality-of-life — pre-commit + maturin build + wheel upload.
# Target: pre-commit phase < 60s.

on:
  push:
    branches: [main]
    paths-ignore:
      - "*.md"
      - "docs/**"
      - "LICENSE"
  pull_request:
    branches: [main]
    paths-ignore:
      - "*.md"
      - "docs/**"
      - "LICENSE"

# Cancel in-flight runs on same ref.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  PYTHON_VERSION: "3.14"
  # uv: faster, deterministic Python package management
  UV_SYSTEM_PYTHON: "0"

jobs:
  pre-commit:
    name: pre-commit · ruff · pyright · cargo
    runs-on: macos-latest
    timeout-minutes: 5

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0  # needed for pre-commit to scan all files

      - name: Install uv
        uses: astral-sh/setup-uv@v4
        with:
          enable-cache: true
          cache-dependency-glob: |
            pyproject.toml
            uv.lock

      - name: Set up Python
        run: uv python install ${{ env.PYTHON_VERSION }}

      - name: Install Rust (for cargo check hook)
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: stable
          targets: aarch64-apple-darwin

      - name: Cache cargo registry
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
          key: ${{ runner.os }}-cargo-${{ hashFiles('rust_extensions/Cargo.lock') }}
          restore-keys: ${{ runner.os }}-cargo-

      - name: Cache pre-commit env
        uses: actions/cache@v4
        with:
          path: ~/.cache/pre-commit
          key: pre-commit-${{ runner.os }}-${{ hashFiles('.pre-commit-config.yaml') }}
          restore-keys: pre-commit-${{ runner.os }}-

      - name: Install pre-commit hooks
        run: uv run --no-sync pre-commit install --install-hooks

      - name: Run pre-commit (CI mode — all files)
        # --all-files: CI scans all tracked files, not just staged
        # --show-diff-on-failure: inline diff for CI artifact inspection
        run: |
          uv run --no-sync pre-commit run --all-files --show-diff-on-failure

  ble-audit:
    name: ble-audit · BLE001 dynamic audit
    runs-on: macos-latest
    timeout-minutes: 3

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v4
        with:
          enable-cache: true
          cache-dependency-glob: |
            pyproject.toml
            uv.lock

      - name: Set up Python
        run: uv python install ${{ env.PYTHON_VERSION }}

      - name: BLE001 audit (CI mode — fail on NEW violations)
        run: make audit-ci

  # ISSUE-04: DuckDB connection pool canonical path guard
  duckdb-pool-guard:
    name: duckdb-pool · canonical write path guard
    runs-on: macos-latest
    timeout-minutes: 3

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v4
        with:
          enable-cache: true
          cache-dependency-glob: |
            pyproject.toml
            uv.lock

      - name: Set up Python
        run: uv python install ${{ env.PYTHON_VERSION }}

      - name: ISSUE-04: Check for unauthorized duckdb.connect() usage
        run: |
          echo "=== ISSUE-04: DuckDB Connection Pool Canonical Path Guard ==="
          uv run --no-sync python tools/scripts/check_duckdb_connect.py

  python-jit-benchmark:
    name: python-jit-benchmark · JIT vs non-JIT
    runs-on: macos-latest
    timeout-minutes: 15
    # Run on main pushes and PRs to track JIT delta over time
    if: "github.event_name == 'push' || github.event_name == 'pull_request'"

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v4
        with:
          enable-cache: true
          cache-dependency-glob: |
            pyproject.toml
            uv.lock

      - name: Set up Python
        run: uv python install ${{ env.PYTHON_VERSION }}

      - name: Sync dependencies
        run: uv sync --locked --python ${{ env.PYTHON_VERSION }}

      - name: Run tests WITHOUT JIT (baseline)
        run: |
          echo "=== WITHOUT JIT ==="
          UV_JIT=0 uv run pytest tests/test_rust_extensions.py tests/test_hledac_core_rust.py -v --durations=0 2>&1 | tee pytest_no_jit.log
          echo "EXIT_CODE=$?" >> $GITHUB_ENV

      - name: Run tests WITH JIT (PYTHON_JIT=1)
        run: |
          echo "=== WITH JIT ==="
          UV_JIT=1 uv run pytest tests/test_rust_extensions.py tests/test_hledac_core_rust.py -v --durations=0 2>&1 | tee pytest_jit.log

      - name: Extract timing summary
        run: |
          echo "=== JIT BENCHMARK SUMMARY ==="
          echo "--- Without JIT (baseline) ---"
          grep -E "^(PASSED|FAILED|ERROR)" pytest_no_jit.log || true
          echo "--- With JIT ---"
          grep -E "^(PASSED|FAILED|ERROR)" pytest_jit.log || true
          echo "--- Duration comparison ---"
          echo "Without JIT exit code: ${{ env.EXIT_CODE }}"

      - name: Upload benchmark artifacts
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: jit-benchmark-logs
          path: |
            pytest_no_jit.log
            pytest_jit.log
          retention-days: 7

  # ISSUE-01: Rust extension freshness gate — runs in parallel with build-rust
  rust-freshness:
    name: rust-freshness · source vs binary check
    runs-on: macos-latest
    timeout-minutes: 5
    # Only run when Rust source files have changed
    if: "github.event_name == 'push' || github.event_name == 'pull_request'"
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v4
        with:
          enable-cache: true
          cache-dependency-glob: |
            pyproject.toml
            uv.lock

      - name: Set up Python
        run: uv python install ${{ env.PYTHON_VERSION }}

      - name: Sync project venv
        run: uv sync --locked --python ${{ env.PYTHON_VERSION }}

      - name: ISSUE-01: Source freshness gate
        run: |
          echo "=== Rust Extension Source Freshness Check ==="
          echo "Checking if .so binary is stale (source newer than binary)..."
          uv run --no-sync python -c "
import sys
sys.path.insert(0, '.')
from core.rust_backend._prober import _check_source_freshness, _get_rust_source_mtime, _so_mtime, _get_rebuild_instruction

src_mtime = _get_rust_source_mtime()
so_mtime = _so_mtime()

if src_mtime is None:
    print('No Rust source directory found — skipping check')
    sys.exit(0)

if so_mtime is None:
    print('No .so file found — Rust extension not built')
    print('Run: make rust-build')
    sys.exit(0)

is_stale, reason = _check_source_freshness()
print(f'Source mtime: {src_mtime}')
print(f'So mtime: {so_mtime}')
print(f'Stale: {is_stale}')
print(f'Reason: {reason}')

if is_stale:
    print('')
    print('=' * 60)
    print('ERROR: Rust extension is STALE!')
    print('=' * 60)
    print('The .so binary was built BEFORE the source files were modified.')
    print('This means the binary is running OLD code while source has been updated.')
    print('Performance may be degraded and bugs may exist.')
    print('')
    print('To rebuild:')
    print(_get_rebuild_instruction())
    print('')
    sys.exit(1)
else:
    print('OK: Source and binary are in sync')
    sys.exit(0)
"
        # Don't fail CI if .so doesn't exist yet (first build)
        continue-on-error: true

  build-rust:
    name: maturin build · wheel
    runs-on: macos-latest
    timeout-minutes: 20
    needs: pre-commit
    strategy:
      fail-fast: false
      matrix:
        target:
          - aarch64-apple-darwin
          - x86_64-apple-darwin

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Guard — core/rust_backend.py must not exist
        # Issue #3: this file shadows core/rust_backend/ package on Python 3.12+
        run: test ! -f core/rust_backend.py

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: stable
          targets: ${{ matrix.target }}

      - name: Cache cargo target
        uses: actions/cache@v4
        with:
          path: |
            rust_extensions/target
            ~/.cargo/registry
            ~/.cargo/git
          key: ${{ runner.os }}-${{ matrix.target }}-cargo-${{ hashFiles('rust_extensions/Cargo.lock') }}
          restore-keys: ${{ runner.os }}-${{ matrix.target }}-cargo-

      - name: Install uv
        uses: astral-sh/setup-uv@v4
        with:
          enable-cache: true
          cache-dependency-glob: |
            pyproject.toml
            uv.lock

      - name: Set up Python
        run: uv python install ${{ env.PYTHON_VERSION }}

      - name: Sync project venv
        run: uv sync --locked --python ${{ env.PYTHON_VERSION }}
        env:
          UV_SYSTEM_PYTHON: "0"

      - name: Check for broken deps (Issue #50)
        # Fails if mlx-lm "transformers>=5.0.0" METADATA claim conflicts with actual pins
        run: uv pip check

      - name: Build Rust extension + wheel
        uses: PyO3/maturin-action@v1
        with:
          working-directory: rust_extensions
          command: develop --release
          args: --release
        env:
          UV_PYTHON: ""
          # ISSUE-01: M1 8GB memory optimization
          CARGO_PROFILE_RELEASE_LTO: "false"
          CARGO_PROFILE_RELEASE_CODEGEN_UNITS: "16"
          # MACOSX_DEPLOYMENT_TARGET: controlled by rust_extensions/Cargo.toml

      - name: Smoke test — verify_build.py
        working-directory: rust_extensions
        run: uv run --no-sync python verify_build.py

      - name: Run sprint test suite
        # Full pytest excluding probe dirs (external deps with collection errors)
        run: make test-ci

      - name: Run parity tests sequentially
        run: uv run --no-sync pytest tests/test_f227k_acquisition_lane_parity.py -v

      - name: Upload wheel artifact
        uses: actions/upload-artifact@v4
        with:
          name: wheels
          path: rust_extensions/target/wheels/*.whl
          retention-days: 1

  # ── Wheel upload — only on main branch, tagged releases ──────────────────
  publish:
    name: publish to PyPI
    runs-on: macos-latest
    timeout-minutes: 10
    needs: build-rust
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'

    permissions:
      id-token: write  # needed for trusted publishing

    steps:
      - name: Download wheel artifact
        uses: actions/download-artifact@v4
        with:
          name: wheels
          path: dist/

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: dist/
