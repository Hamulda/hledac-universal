name: Rust Extensions CI

# Verifies the hledac-rust-extensions maturin build on every push and PR.
#
# Architecture:
#   - macOS jobs (aarch64 + x86_64): full maturin wheel build + smoke + benchmarks
#   - Linux job: cargo check + clippy + fmt only — PyO3 cross-compile for
#     wheel distribution is not viable from macOS; Linux validation is done
#     via cargo check to guarantee multi-platform source compatibility.
#
# macOS-only wheel build is intentional — the M1 8GB production target runs
# macOS, and maturin cannot cross-compile PyO3 bindings from macOS → Linux.
# The Linux job provides source-level multi-platform coverage without
# requiring a Linux runner for wheel builds.
#
# Pipeline (macOS):
#   1. checkout
#   2. install Rust stable (dtolnay/rust-toolchain) + Python 3.14 (uv)
#   3. cache: cargo target/ + uv venv (keyed on Cargo.lock / pyproject.toml)
#   4. maturin build --release → wheel artifact
#   5. maturin develop --release → install into venv for local testing
#   6. Stub guard — exactly 1 canonical hledac_rust_extensions.pyi (ISSUE-002)
#   7. verify_build.py smoke test (5/5 PASS required)
#   8. benchmarks/bench_rust_vs_python.py (must finish under 30s budget)
#   9. pytest tests/ -k "rust or extension" -x
#   10. Python fallback guard (extension removed → Python modules still work)
#
# Pipeline (Linux):
#   1. checkout
#   2. install Rust stable + cross-compile target x86_64-unknown-linux-gnu
#   3. cache: cargo target/ (keyed on Cargo.lock)
#   4. cargo check --all-features (full compile without linking)
#   5. cargo clippy --all-features (lint + warnings as errors)
#   6. cargo fmt --check (format verification)

on:
  workflow_dispatch:
    # Allows manual triggering from GitHub UI / API.
    # Useful for debugging failures without pushing a commit.
  push:
    branches: [main]
    paths:
      - "rust_extensions/**"
      - ".github/workflows/rust_extensions.yml"
      - "pyproject.toml"
      - "uv.lock"
  pull_request:
    branches: [main]
    paths:
      - "rust_extensions/**"
      - ".github/workflows/rust_extensions.yml"
      - "pyproject.toml"
      - "uv.lock"

# Cancel in-flight runs on the same ref to save CI minutes.
concurrency:
  group: rust-extensions-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: "1"

jobs:
  # ── Linux: cargo check + clippy + fmt (no wheel — cross-compile not viable) ─
  linux-check:
    name: cargo check · linux-x86_64
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust toolchain (stable)
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: stable
          targets: x86_64-unknown-linux-gnu

      - name: Cache cargo target
        uses: actions/cache@v4
        with:
          path: |
            rust_extensions/target
            ~/.cargo/registry
            ~/.cargo/git
          key: linux-cargo-${{ hashFiles('rust_extensions/Cargo.lock') }}
          restore-keys: linux-cargo-

      - name: Cargo check (all features)
        working-directory: rust_extensions
        run: cargo check --all-features

      - name: Cargo clippy (all features, warnings as errors)
        working-directory: rust_extensions
        run: cargo clippy --all-features --all-targets -- -D warnings

      - name: Cargo fmt check
        working-directory: rust_extensions
        run: cargo fmt --check

  # ── macOS matrix: maturin wheel build + full test suite ─────────────────────
  # NOTE: macos-latest = ARM64 (M1/M2), macos-13 = Intel x86_64.
  # Explicit runner mapping is required — matrix platform name ≠ GitHub runner label.
  build-and-test:
    name: maturin build · ${{ matrix.platform }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        platform: [macos-arm64, macos-x86_64]
        runner:   [macos-latest,  macos-13]   # ← explicit arch mapping
        include:
          - platform: macos-arm64
            target: aarch64-apple-darwin
          - platform: macos-x86_64
            target: x86_64-apple-darwin

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust toolchain (stable)
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: stable
          targets: ${{ matrix.target }}

      - name: Cache cargo target
        uses: actions/cache@v4
        with:
          path: |
            rust_extensions/target
            ~/.cargo/registry
            ~/.cargo/git
          key: ${{ runner.os }}-${{ matrix.target }}-cargo-${{ hashFiles('rust_extensions/Cargo.lock') }}
          restore-keys: ${{ runner.os }}-${{ matrix.target }}-cargo-

      - name: Cache uv venv
        uses: actions/cache@v4
        with:
          path: .venv
          key: uv-${{ runner.os }}-python3.14-${{ hashFiles('pyproject.toml', 'uv.lock') }}
          restore-keys: uv-${{ runner.os }}-python3.14-

      - name: Install uv
        uses: astral-sh/setup-uv@v4
        with:
          enable-cache: true
          cache-dependency-glob: |
            pyproject.toml
            uv.lock

      - name: Set up Python
        run: uv python install 3.14

      - name: Sync project venv
        run: uv sync --python 3.14
        # Creates .venv/ with all runtime deps from pyproject.toml.
        # Rust extension is intentionally NOT in pyproject deps — built below
        # via maturin so the build step is explicit and reproducible.

      - name: Build wheel + develop (maturin)
        uses: PyO3/maturin-action@v1
        with:
          working-directory: rust_extensions
          # build: produces .whl artifact (uploaded below)
          # develop: installs into venv for local smoke/benchmark tests
          command: build develop
          args: --release --out dist/wheels
        env:
          UV_PYTHON: ""
          # MACOSX_DEPLOYMENT_TARGET: controlled by rust_extensions/Cargo.toml

      - name: Stub guard — single hledac_rust_extensions.pyi
        # ISSUE-002: Exactly 1 canonical stub must exist. Multiple stubs accumulate
        # when maturin runs with different python-source configs. Fail CI if ≠ 1.
        run: |
          COUNT=$(find rust_extensions -name "hledac_rust_extensions.pyi" | wc -l | tr -d ' ')
          if [ "$COUNT" != "1" ]; then
            echo "ERROR: Found $COUNT hledac_rust_extensions.pyi files (expected 1)"
            find rust_extensions -name "hledac_rust_extensions.pyi"
            exit 1
          fi
          echo "OK: exactly 1 canonical stub present"

      - name: Regenerate stub — maturin generate-stubs
        # ISSUE-002: Canonical stub generation via maturin. Output to .stub/ temp dir,
        # then copy to rust_extensions/ as the single canonical .pyi. Guard above
        # ensures no duplication. This step is CI-only; local devs run it manually.
        run: |
          mkdir -p .stub
          maturin generate-stubs -o .stub --bindings pyo3
          # Copy generated stub to canonical location
          cp .stub/hledac_rust_extensions/__init__.pyi rust_extensions/hledac_rust_extensions.pyi
          rm -rf .stub
          echo "OK: canonical stub regenerated from source"

      - name: Smoke test — verify_build.py
        working-directory: rust_extensions
        run: |
          # verify_build.py exits 1 on any FAIL, 0 on all-PASS.
          # 5/5 modules: aho_corasick, bloom, rolling_hash, fast_hasher, content_hash.
          uv run --no-sync python verify_build.py

      - name: CI otool check — no /opt/homebrew in release artifact
        # R4 FIX: Verifies DuckDB is statically bundled, not dynamically linked to Homebrew.
        # Release artifact must NOT contain /opt/homebrew paths (CI fails otherwise).
        # Only applies to macOS aarch64 (M1) where Homebrew DuckDB is a risk.
        if: matrix.platform == 'macos-arm64'
        run: |
          WHEEL=$(find rust_extensions/dist/wheels -name "*.whl" -path "*macos*" | head -1)
          if [ -z "$WHEEL" ]; then
            echo "WARNING: No macOS wheel found in dist/wheels — skipping otool check"
            exit 0
          fi
          echo "Checking wheel: $WHEEL"
          # Extract and check the dylib for Homebrew paths
          python -c "
import zipfile, subprocess, tempfile, os
with tempfile.TemporaryDirectory() as tmpdir:
    with zipfile.ZipFile('$WHEEL', 'r') as z:
        z.extractall(tmpdir)
    for root, dirs, files in os.walk(tmpdir):
        for f in files:
            if f.endswith('.so') or f.endswith('.dylib'):
                path = os.path.join(root, f)
                result = subprocess.run(['otool', '-L', path], capture_output=True, text=True)
                for line in result.stdout.splitlines():
                    if '/opt/homebrew' in line:
                        print(f'FAIL: {path} links to Homebrew: {line.strip()}')
                        exit(1)
    print('OK: No /opt/homebrew dependencies found in wheel')
"

      - name: Benchmark — bench_rust_vs_python.py
        run: |
          # Must finish in <30s and report a valid speedup row.
          uv run --no-sync python benchmarks/bench_rust_vs_python.py

      - name: Test suite (rust + extension)
        run: |
          # Targeted at the two dedicated test modules. The repo-wide
          # `tests/` tree contains older sprint probes with collection
          # errors (e.g. swigvarlink deprecation) that are out of scope
          # for the rust_extensions CI lane. Run those in a separate
          # workflow (`sprint_tests.yml` etc.).
          uv run --no-sync pytest tests/test_rust_extensions.py tests/test_hledac_core_rust.py -v

      - name: Verify fallback guard (Python without Rust)
        # Sanity check: when the Rust extension is removed, the Python
        # modules must still import and operate. This guarantees the
        # always-on / fail-soft invariant in CLAUDE.md.
        run: |
          uv run --no-sync python - <<'PY'
          import sys, importlib, types

          # Hide the extension so any `import hledac_rust_extensions` raises ImportError.
          sys.modules["hledac_rust_extensions"] = None  # type: ignore[assignment]

          for mod_name in [
              "patterns.pattern_matcher",
              "tools.url_dedup",
              "tools.rolling_hash_engine",
              "tools.ioc_dedup",
              "utils.bloom_filter",
          ]:
              # Re-import fresh.
              if mod_name in sys.modules:
                  del sys.modules[mod_name]
              m = importlib.import_module(mod_name)
              has_aco = hasattr(m, "_RUST_ACO_AVAILABLE")
              has_bloom = getattr(m, "_RUST_BLOOM_AVAILABLE", False)
              has_rh = getattr(m, "_RUST_RH_AVAILABLE", False)
              has_url = getattr(m, "_RUST_URL_DEDUP_AVAILABLE", False)
              has_engine = getattr(m, "_RUST_URL_ENGINE_AVAILABLE", False)
              print(f"OK {mod_name} "
                    f"aco={has_aco} bloom={has_bloom} rh={has_rh} "
                    f"url={has_url} engine={has_engine}")

          # Python fallback should be importable without the extension.
          from patterns.pattern_matcher import get_backend_info
          from tools.rolling_hash_engine import RollingHashEngine
          eng = RollingHashEngine()
          assert eng.is_rust is False, "fallback should not advertise Rust"
          assert eng.hash(b"hello world") != 0, "Python fallback must still work"
          print("OK Python fallback: RollingHashEngine.hash(b'hello world') =", eng.hash(b"hello world"))
          PY

      - name: Upload wheel artifact
        uses: actions/upload-artifact@v4
        with:
          name: wheels-${{ matrix.platform }}
          path: rust_extensions/dist/wheels/*.whl
          retention-days: 5
