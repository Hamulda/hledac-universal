
[features]
memories = true

[agent]
provider = "minimax"
api_key_env = "MINIMAX_API_KEY"
default_model = "MiniMax-M3"
reasoning_effort = "xhigh"
enable_self_review = true
refine_prompts_enabled = true

[agent.small_model]
model = "MiniMax-M2.7"

[agent.prompt_suggestions]
model = "MiniMax-M2.7"

[agent.persistent_memory]
enabled = true

[subagents]
enabled = false

[mcp]
enabled = true

[provider.anthropic]

[provider.anthropic.advisor]
enabled = true
model = "MiniMax-M2.7"

[dotfile_protection]
blocked_operations = [
    "git_operations",
    "project_initialization",
    "build_operations",
    "test_execution",
    "linting",
    "auto_fix",
]

[workspace]
use_root_config = true
